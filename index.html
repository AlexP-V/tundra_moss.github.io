<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aleksandra Pavlova-Verevkina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Londrina+Shadow&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #f2ece0;
      --grid: rgba(0, 0, 0, 0.055);
      --grid-sz: 22px;
      --ink: #1a1814;
      --ink-2: #5c5850;
      --ink-3: #9e9890;
      --border: #d0cac0;
      --surface: #faf7f0;
      --mustard: #c4953a;
      --soft-bg: #f1e3cf;
      --soft-bd: #d7c2a5;
      --soft-ink: #8a6a43;
      --hard-bg: #e4ebf0;
      --hard-bd: #b7c6d4;
      --hard-ink: #475b6e;
    }

    html {
      font-size: 110%;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background-color: var(--bg);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: var(--grid-sz) var(--grid-sz);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      padding: 2.25rem 3rem 1.5rem;
    }

    .header-cols {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4rem;
      align-items: center;
    }

    .header-center {
      display: flex;
      justify-content: flex-start;
      padding-top: 0.5rem;
    }

    .eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-family: 'Londrina Shadow', 'Space Grotesk', sans-serif;
      font-size: clamp(3rem, 7.2vw, 8.5rem);
      font-weight: 400;
      letter-spacing: 0.01em;
      line-height: 0.95;
    }

    .header-role {
      font-family: 'Space Mono', monospace;
      font-size: clamp(0.95rem, 1.9vw, 1.7rem);
      letter-spacing: 0.06em;
      color: var(--ink);
      margin-top: 1rem;
      display: inline-block;
      background: linear-gradient(103deg,
          transparent 1.8%,
          rgba(255, 228, 25, 0.497) 2.4%,
          rgba(255, 224, 15, 0.72) 38%,
          rgba(255, 231, 28, 0.83) 63%,
          rgba(255, 223, 18, 0.354) 96.5%,
          transparent 97.5%);
      padding: 0.08em 0.22em 0.06em;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }

    /* Name block on the left, contact icons in the free space to its right */
    .header-left {
      display: flex;
      align-items: center;
      gap: 3rem;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    nav a {
      display: flex;
      color: var(--mustard);
      transition: color .18s, transform .18s;
    }

    nav a svg {
      width: clamp(4rem, 6.4vw, 6rem);
      height: clamp(4rem, 6.4vw, 6rem);
    }

    /* Playful tilt — each icon leans a different way */
    nav a:nth-child(1) {
      transform: rotate(-8deg);
    }

    nav a:nth-child(2) {
      transform: rotate(6deg);
    }

    nav a:hover,
    nav a:focus-visible {
      color: var(--ink);
      transform: rotate(0deg) scale(1.08);
    }

    /* ── SKILLS TICKER ── */
    .skills-ticker {
      overflow: hidden;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 0.55rem 0;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
    }

    .skills-track {
      display: flex;
      width: max-content;
      animation: ticker 60s linear infinite;
    }

    .skills-ticker:hover .skills-track {
      animation-play-state: paused;
    }

    .skills-group {
      display: flex;
      gap: 0.5rem;
      padding-right: 0.5rem;
      flex-shrink: 0;
    }

    .skills-group .skill-tag {
      white-space: nowrap;
      font-size: 0.8rem;
    }

    @keyframes ticker {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    @keyframes ticker-v {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-50%);
      }
    }

    /* Mobile: the line becomes a vertical strip pinned to the left edge */
    @media (max-width: 767px) {
      body {
        padding-left: 2.6rem;
      }

      .skills-ticker {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: 2.6rem;
        z-index: 50;
        background: var(--bg);
        border: none;
        border-right: 1px solid var(--border);
        padding: 0 0.4rem;
        -webkit-mask-image: linear-gradient(180deg, transparent, #000 4%, #000 96%, transparent);
        mask-image: linear-gradient(180deg, transparent, #000 4%, #000 96%, transparent);
      }

      .skills-track {
        flex-direction: column;
        width: auto;
        animation-name: ticker-v;
      }

      .skills-group {
        flex-direction: column;
        align-items: center;
        padding-right: 0;
        padding-bottom: 0.5rem;
      }

      .skills-group .skill-tag {
        writing-mode: vertical-rl;
        font-size: 0.7rem;
        padding: 0.7rem 0.28rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .skills-ticker {
        overflow-x: auto;
        overflow-y: auto;
      }

      .skills-track {
        animation: none;
      }
    }

    /* ── FILTER BAR ── */
    .filter-bar {
      padding: 0 3rem;
      display: flex;
      border-bottom: 1px solid var(--border);
    }

    .filter-btn {
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 0.65rem 1.4rem 0.55rem;
      cursor: pointer;
      margin-bottom: -1px;
      transition: color .18s;
    }

    .filter-btn:hover {
      color: var(--mustard);
    }

    .filter-btn.active {
      color: var(--mustard);
      border-bottom-color: var(--mustard);
    }

    /* ── PHOTO CLIP ── */
    .photo-clip {
      position: relative;
      width: 224px;
      transform: rotate(-2.5deg) translateX(8px);
      transform-origin: top center;
      filter: drop-shadow(3px 6px 14px rgba(0, 0, 0, 0.14));
      perspective: 900px;
      z-index: 1;
    }

    /* While focus mode is active the clip is lifted above the dim backdrop
       (its centring transform is driven inline from JS). */
    .photo-clip.focus-active {
      z-index: 1000;
    }

    /* ── CLICK HINT ── cursor-click icon tucked at the photo's corner */
    .photo-hint {
      position: absolute;
      right: -30px;
      bottom: -26px;
      z-index: 3;
      pointer-events: none;
      color: var(--mustard);
      transform-origin: top left;
      animation: hint-bob 1.7s ease-in-out infinite;
      transition: opacity .35s;
    }

    .photo-hint-icon {
      display: block;
      filter: drop-shadow(1px 2px 3px rgba(0, 0, 0, 0.18));
    }

    @keyframes hint-bob {

      0%,
      100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(-4px, -4px);
      }
    }

    /* Hide the cue while the note is open, and for good once it's been used. */
    .photo-clip.focus-active .photo-hint,
    .photo-clip.hint-dismissed .photo-hint {
      opacity: 0;
    }

    .photo-clip.hint-dismissed .photo-hint {
      pointer-events: none;
      animation: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .photo-hint {
        animation: none;
      }
    }

    .photo-flip {
      all: unset;
      display: block;
      width: 100%;
      cursor: pointer;
    }

    .photo-flip:focus-visible {
      outline: 2px solid var(--mustard);
      outline-offset: 4px;
    }

    .photo-card {
      position: relative;
      width: 100%;
      display: block;
      transform-style: preserve-3d;
      transition: transform .55s cubic-bezier(.4, 0, .2, 1);
    }

    /* Card flips to the note only in focus mode (click to open). A subtle
       hover cue hints it's interactive without committing the flip. */
    .photo-clip:not(.focus-active):hover .photo-card {
      transform: translateY(-3px);
    }

    .photo-clip.focus-active .photo-card {
      transform: rotateY(180deg);
    }

    /* ── FOCUS BACKDROP ── dims the rest of the site while the note is open */
    .focus-backdrop {
      position: fixed;
      inset: 0;
      z-index: 900;
      background: rgba(20, 16, 12, 0.62);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .45s ease;
    }

    .focus-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    .photo-face {
      width: 100%;
      height: 100%;
      display: block;
      backface-visibility: hidden;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: #fff;
    }

    .photo-front {
      position: relative;
      z-index: 1;
    }

    .photo-back {
      position: absolute;
      inset: 0;
      transform: rotateY(180deg);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.7rem;
      overflow: hidden;
    }

    .note {
      width: 100%;
      height: 100%;
      border: none;
      padding: 0.6rem;
      background: repeating-linear-gradient(0deg,
          rgba(0, 0, 0, 0.04) 0,
          rgba(0, 0, 0, 0.04) 1px,
          transparent 1px,
          transparent 14px);
      font-family: 'Caveat', 'Space Mono', monospace;
      color: var(--ink-2);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      overflow: hidden;
    }

    .note-title {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .note-text {
      font-size: 0.82rem;
      line-height: 1.2;
    }

    .note-sign {
      margin-top: auto;
      font-size: 0.85rem;
      text-align: right;
    }

    .photo-clip img {
      width: 100%;
      height: auto;
      display: block;
    }

    .paperclip {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      pointer-events: none;
    }

    @keyframes sway {
      0% {
        transform: rotate(-2.5deg) translateX(8px);
      }

      18% {
        transform: rotate(4.5deg) translateX(8px);
      }

      36% {
        transform: rotate(-5.5deg) translateX(8px);
      }

      54% {
        transform: rotate(3deg) translateX(8px);
      }

      72% {
        transform: rotate(-3.5deg) translateX(8px);
      }

      88% {
        transform: rotate(-2deg) translateX(8px);
      }

      100% {
        transform: rotate(-2.5deg) translateX(8px);
      }
    }

    .photo-clip.swaying {
      animation: sway 0.9s cubic-bezier(.4, 0, .2, 1);
    }

    /* ── HERO ── */
    .hero {
      padding: 2rem 3rem 1.5rem;
      max-width: 900px;
    }

    .bio {
      font-size: 0.88rem;
      line-height: 1.65;
      color: var(--ink-2);
      max-width: 580px;
    }

    /* ── SECTION LABEL ── */
    .sec-label {
      padding: 0.4rem 3rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    /* ── ACCORDION ── */
    .accordion-wrap {
      padding: 0 3rem 3rem;
    }

    .accordion {
      display: flex;
      gap: 2px;
      height: calc(100vh - 370px);
      min-height: 460px;
      max-height: 660px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .panel {
      position: relative;
      flex: 0 0 52px;
      overflow: hidden;
      cursor: pointer;
      transition: flex .52s cubic-bezier(.4, 0, .2, 1);
      border-right: 1px solid rgba(0, 0, 0, .07);
    }

    .panel:last-child {
      border-right: none;
    }

    .panel.open {
      flex: 1;
      cursor: default;
    }

    /* color fill (solid when collapsed, hidden behind content when open) */
    .panel-fill {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    /* Featured (paid job) entry: white cover with a navy outline so it stands
       out from the warm project covers. */
    .panel--featured .panel-fill {
      background: #fff !important;
      box-shadow: inset 0 0 0 2px #2f4a6e;
    }

    .panel--featured .spine-code {
      color: rgba(47, 74, 110, .6);
    }

    .panel--featured .spine-title {
      color: #2f4a6e;
    }

    .panel--featured .spine-dot {
      background: rgba(47, 74, 110, .45);
    }

    /* ── SPINE (collapsed) ── */
    .panel-spine {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 0;
      opacity: 1;
      transition: opacity .15s;
      pointer-events: none;
    }

    .panel.open .panel-spine {
      opacity: 0;
    }

    .spine-code {
      font-family: 'Space Mono', monospace;
      font-size: 0.48rem;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, .5);
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    .spine-title {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, .92);
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      white-space: nowrap;
    }

    .spine-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .3);
    }

    /* ── CONTENT (expanded) ── */
    .panel-content {
      position: absolute;
      inset: 0;
      z-index: 2;
      padding: 1.75rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease .28s;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--surface);
      background-image:
        linear-gradient(rgba(0, 0, 0, .038) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, .038) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .panel.open .panel-content {
      opacity: 1;
      pointer-events: all;
    }

    .panel-content::-webkit-scrollbar {
      width: 3px;
    }

    .panel-content::-webkit-scrollbar-track {
      background: transparent;
    }

    .panel-content::-webkit-scrollbar-thumb {
      background: var(--border);
    }

    .c-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1.2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .c-code {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 0.3rem;
    }

    .c-title {
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .c-role {
      font-family: 'Space Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.06em;
      color: var(--ink-2);
      margin-top: 0.4rem;
    }

    .c-right {
      text-align: right;
      flex-shrink: 0;
    }

    .c-date {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.06em;
      color: var(--ink-3);
      white-space: nowrap;
    }

    .c-status {
      font-family: 'Space Mono', monospace;
      font-size: 0.5rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-top: 0.25rem;
      opacity: 0.65;
    }

    .c-img {
      width: 100%;
      height: 128px;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .c-img-video {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .c-img-play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.7);
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding-left: 3px;
      transition: background 0.2s, transform 0.2s;
    }

    .c-img-play:hover {
      background: rgba(0, 0, 0, 0.78);
      transform: translate(-50%, -50%) scale(1.08);
    }

    .c-img-deck {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 0.9rem;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: background 0.2s, transform 0.2s;
    }

    .c-img-deck:hover {
      background: rgba(0, 0, 0, 0.78);
      transform: translate(-50%, -50%) scale(1.05);
    }

    .canva-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(10, 8, 6, 0.88);
      backdrop-filter: blur(4px);
      padding: 2.5rem 1.5rem;
    }

    .canva-modal.open {
      display: flex;
    }

    .canva-box {
      width: min(1000px, 100%);
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      position: relative;
    }

    .canva-close {
      position: absolute;
      top: -2rem;
      right: 0;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.8rem;
      line-height: 1;
      cursor: pointer;
      opacity: 0.8;
    }

    .canva-close:hover {
      opacity: 1;
    }

    .canva-frame-wrap {
      position: relative;
      width: 100%;
      padding-top: 62.5%;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .canva-frame-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .pdf-scroll {
      display: none;
      max-height: 82vh;
      overflow-y: auto;
      border-radius: 6px;
      background: #1c1814;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      padding: 0.6rem;
    }

    .pdf-page {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 2px;
    }

    .pdf-page+.pdf-page {
      margin-top: 0.6rem;
    }

    .pdf-msg {
      color: #cbb89c;
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      text-align: center;
      padding: 2rem;
    }

    .canva-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    .canva-arrow {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      transition: background 0.2s;
    }

    .canva-arrow:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .canva-dots {
      display: flex;
      gap: 0.5rem;
    }

    .canva-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: transparent;
      padding: 0;
      cursor: pointer;
      transition: background 0.2s;
    }

    .canva-dot.active {
      background: #fff;
    }

    .c-img-photo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .c-img-cover {
      object-fit: cover;
    }

    /* Project covers match the clips: capped at 40vh tall, sized to their own
       aspect and centred. Landscape covers end up wider than portrait clips. */
    .panel-content .c-img {
      height: auto;
      max-height: 40vh;
      width: fit-content;
      max-width: 100%;
      margin-left: auto;
      margin-right: auto;
    }

    .c-title-link {
      color: inherit;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.15em;
    }

    .c-title-link:hover {
      color: var(--mustard);
    }

    /* YouTube embeds have no intrinsic size: fill the width at 16:9,

    const MS_STAMP_W = 130;
    const MS_GAP = 96;
    const MS_STEP = MS_STAMP_W + MS_GAP; // 226
    const MS_CONTAINER_W = 609;
    const MS_OFFSET = Math.round((MS_CONTAINER_W - MS_STAMP_W) / 2); // 288

    // Infinite loop: render several repeated copies of the milestones and keep
    // the active slot inside the middle copy, snapping back invisibly at the edges.
    const MS_N = MILESTONES.length;
    const MS_COPIES = 9;                 // odd, so there is a true middle copy
    const MS_TOTAL = MS_N * MS_COPIES;
    const MS_BASE = Math.floor(MS_COPIES / 2) * MS_N; // first index of middle copy
    const MS_INITIAL = 1;               // milestone centred on load (Thesis Driving Game — Prototype Completed)

    // `pos` is the rendered-item index currently centred; data index = pos mod N.
    const MS_STATE = { pos: MS_BASE + MS_INITIAL };
    let msNavToken = 0;

    function msData(pos) { return ((pos % MS_N) + MS_N) % MS_N; }

    // ── OPACITY ENGINE ───────────────────────────────────────────
    // Each stamp's opacity tracks how much of it sits inside the carousel
    // area: 0 when fully outside, up to 0.3 when fully inside; the active
    // stamp goes to 1. Driven per-frame so it eases as stamps slide in/out.

    function msTargetOpacity(item, oRect) {
      const r = item.getBoundingClientRect();
      if (!r.width) return item.classList.contains('ms-active') ? 1 : 0;
      const visible = Math.min(r.right, oRect.right) - Math.max(r.left, oRect.left);
      const f = Math.max(0, Math.min(1, visible / r.width));
      return item.classList.contains('ms-active') ? 1 : 0.3 * f;
    }

    // Snap every stamp straight to its target (no easing) — used on first
    // layout and after the invisible recenter jump, to avoid a fade flash.
    function msSnapOpacity() {
      const outer = document.getElementById('ms-carousel-outer');
      const track = document.getElementById('ms-track');
      if (!outer || !track) return;
      const oRect = outer.getBoundingClientRect();
      track.querySelectorAll('.ms-item').forEach(item => {
        const t = msTargetOpacity(item, oRect);
        item._op = t;
        item.style.opacity = t.toFixed(3);
      });
    }

    let msRafId = 0;
    let msAnimUntil = 0;

    function msTick() {
      const outer = document.getElementById('ms-carousel-outer');
      const track = document.getElementById('ms-track');
      if (!outer || !track) { msRafId = 0; return; }
      const oRect = outer.getBoundingClientRect();
      let moving = false;
      track.querySelectorAll('.ms-item').forEach(item => {
        const t = msTargetOpacity(item, oRect);
        const cur = item._op === undefined ? t : item._op;
        const next = cur + (t - cur) * 0.22;
        if (Math.abs(t - cur) > 0.003) moving = true;
        item._op = next;
        item.style.opacity = next.toFixed(3);
      });
      msRafId = (moving || performance.now() < msAnimUntil)
        ? requestAnimationFrame(msTick) : 0;
    }

    function msRunOpacity() {
      msAnimUntil = performance.now() + 680; // cover the full slide
      if (!msRafId) msRafId = requestAnimationFrame(msTick);
    }

    function msSetStyling(pos) {
      const track = document.getElementById('ms-track');
      if (!track) return;
      track.querySelectorAll('.ms-item').forEach((item, i) =>
        item.classList.toggle('ms-active', i === pos)
      );
    }

    function msMediaHTML(m) {
      if (!m.image && !m.pdf && !m.canva) return '';
      const img = m.image ? `<img src="${m.image}" alt="${m.title}" class="c-img-photo c-img-cover">` : '';
      let btn = '';
      if (m.pdf) {
        btn = `<button class="c-img-deck" onclick="event.stopPropagation(); openModalDecks(['${m.pdf}'])">
             <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="14" rx="1"/><path d="M8 21h8M12 17v4"/></svg>
             View Artbook
           </button>`;
      } else if (m.canva) {
        const decks = Array.isArray(m.canva) ? m.canva : [m.canva];
        btn = `<button class="c-img-deck" onclick='event.stopPropagation(); openModalDecks(${JSON.stringify(decks)})'>
             <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="14" rx="1"/><path d="M8 21h8M12 17v4"/></svg>
             View Presentation
           </button>`;
      }
      return `<div class="c-img ms-media">${img}${btn}</div>`;
    }

    function buildMilestonesView() {
      const track = document.getElementById('ms-track');
      if (!track) return;

      // Repeated milestone copies for seamless looping
      for (let i = 0; i < MS_TOTAL; i++) {
        const m = MILESTONES[msData(i)];
        const item = document.createElement('div');
        item.className = 'ms-item' + (i === MS_STATE.pos ? ' ms-active' : '');
        item.innerHTML = `
          <div class="ms-stamp">
            <img src="${m.seal || 'Uppsala_University_logo.svg.png'}" alt="${m.title} seal" class="ms-stamp-img" draggable="false"/>
          </div>
          <div class="ms-label">${m.title}</div>
        `;
        item.dataset.idx = i;
        item.addEventListener('click', () => msGoTo(i));
        track.appendChild(item);
      }

      // Mobile: a plain vertical stack of "folder" cards — title + date on top,
      // then the seal, then the description. No carousel, no nav dots.
      const mobileList = document.getElementById('ms-mobile-list');
      if (mobileList) {
        mobileList.innerHTML = MILESTONES.map(m => `
          <div class="ms-card">
            <div class="ms-card-head">
              <div class="ms-card-title">${m.title}</div>
              <div class="ms-card-date">${m.date}</div>
            </div>
            <div class="ms-card-seal">
              <img src="${m.seal || 'Uppsala_University_logo.svg.png'}" alt="${m.title} seal" draggable="false"/>
            </div>
            ${msMediaHTML(m)}
            <div class="ms-card-body">${m.body}</div>
          </div>
        `).join('');
      }

      // Initial position: centre active item
      track.style.transition = 'none';
      track.style.transform = `translateX(${MS_OFFSET - MS_STATE.pos * MS_STEP}px)`;
      track.offsetHeight; // force reflow
      track.style.transition = '';
      msSnapOpacity();

      const titleEl = document.getElementById('ms-info-title');
      const dateEl = document.getElementById('ms-info-date');
      const mediaEl = document.getElementById('ms-info-media');
      if (titleEl) titleEl.innerHTML = MILESTONES[msData(MS_STATE.pos)].body;
      if (dateEl) dateEl.textContent = MILESTONES[msData(MS_STATE.pos)].date;
      if (mediaEl) mediaEl.innerHTML = msMediaHTML(MILESTONES[msData(MS_STATE.pos)]);

      // Wheel scroll
      const outer = document.getElementById('ms-carousel-outer');
      let wheelLock = false;
      outer.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (wheelLock) return;
        wheelLock = true;
        setTimeout(() => { wheelLock = false; }, 620);
        const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
        if (d > 0) msGoTo(MS_STATE.pos + 1);
        else if (d < 0) msGoTo(MS_STATE.pos - 1);
      }, { passive: false });

      // Pointer drag
      let dragStartX = null;
      outer.addEventListener('pointerdown', (e) => {
        dragStartX = e.clientX;
        outer.setPointerCapture(e.pointerId);
      });
      outer.addEventListener('pointerup', (e) => {
        if (dragStartX === null) return;
        const dx = e.clientX - dragStartX;
        dragStartX = null;
        if (dx < -40) { msGoTo(MS_STATE.pos + 1); return; }
        if (dx > 40) { msGoTo(MS_STATE.pos - 1); return; }
        // A tap (not a drag): jump to whichever seal/title was clicked. Pointer
        // capture can swallow the per-item click, so resolve the target here too.
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const item = el && el.closest('.ms-item');
        if (item && item.dataset.idx != null) msGoTo(parseInt(item.dataset.idx, 10));
      });

      // Prev / next arrow buttons flanking the carousel
      const prevBtn = document.getElementById('ms-nav-prev');
      const nextBtn = document.getElementById('ms-nav-next');
      if (prevBtn) prevBtn.addEventListener('click', () => msGoTo(MS_STATE.pos - 1));
      if (nextBtn) nextBtn.addEventListener('click', () => msGoTo(MS_STATE.pos + 1));

      // Arrow keys (only when milestones view visible)
      document.addEventListener('keydown', (e) => {
        const view = document.getElementById('hero-milestones-full');
        if (!view || view.hidden) return;
        if (e.key === 'ArrowRight') msGoTo(MS_STATE.pos + 1);
        if (e.key === 'ArrowLeft') msGoTo(MS_STATE.pos - 1);
      });
    }

    // Navigate to a milestone by its data index, taking the shortest looped path.
    function msGoToData(dataIdx) {
      let diff = dataIdx - msData(MS_STATE.pos);
      while (diff > MS_N / 2) diff -= MS_N;
      while (diff < -MS_N / 2) diff += MS_N;
      msGoTo(MS_STATE.pos + diff);
    }

    // After the slide settles, jump (without transition) back to the middle copy.
    // The rendered content repeats with period N, so the jump is visually invisible.
    function msRecenter() {
      const np = MS_BASE + msData(MS_STATE.pos);
      if (np === MS_STATE.pos) return;
      MS_STATE.pos = np;
      const track = document.getElementById('ms-track');
      if (!track) return;
      track.style.transition = 'none';
      track.style.transform = `translateX(${MS_OFFSET - np * MS_STEP}px)`;
      track.offsetHeight; // force reflow
      track.style.transition = '';
      msSetStyling(np);
      msSnapOpacity();
    }

    function msGoTo(pos) {
      if (pos === MS_STATE.pos) return;

      MS_STATE.pos = pos;
      const token = ++msNavToken;

      const track = document.getElementById('ms-track');
      if (!track) return;

      track.style.transform = `translateX(${MS_OFFSET - pos * MS_STEP}px)`;
      msRunOpacity();

      const titleEl = document.getElementById('ms-info-title');
      const dateEl = document.getElementById('ms-info-date');
      if (titleEl) titleEl.classList.add('ms-fade');
      if (dateEl) dateEl.classList.add('ms-fade');

      // Brighten the incoming stamp and reveal its paragraph at the same moment
      setTimeout(() => {
        if (token !== msNavToken) return;
        msSetStyling(pos);
        if (titleEl) {
          titleEl.innerHTML = MILESTONES[msData(pos)].body;
          titleEl.classList.remove('ms-fade');
        }
        if (dateEl) {
          dateEl.textContent = MILESTONES[msData(pos)].date;
          dateEl.classList.remove('ms-fade');
        }
        const mediaEl = document.getElementById('ms-info-media');
        if (mediaEl) mediaEl.innerHTML = msMediaHTML(MILESTONES[msData(pos)]);
      }, 200);

      // Once the slide has finished, snap back to the middle copy
      setTimeout(() => {
        if (token === msNavToken) msRecenter();
      }, 560);
    }

    const HEADER_SKILLS = {
      all: ['Scrum', 'Agile', 'Jira', 'Team Leadership', 'Design Production', 'Game Design', 'Unity', 'Sound Design', 'Risk Management', 'FMOD'],

      tech: ['Scrum', 'Kanban', 'LEAN', 'Jira', 'Risk Management', 'Stakeholder Communication', 'Cross-functional Delivery', 'Financial Analysis', 'Data Analysis']
    };

    // Soft skills shown on every tab, after that tab's hard skills.
    const SOFT_SKILLS_LIST = [

      'Stakeholder Communication',
      'Non-Violent Communication',
      'Conflict Resolution',
      'Team Leadership',
    ];
    const SOFT_SKILLS = new Set(SOFT_SKILLS_LIST);

    // ── HELPERS ──────────────────────────────────────────────────

    function getParam() {
      const v = new URLSearchParams(location.search).get('view');
      return ['games', 'tech', 'achievements'].includes(v) ? v : getHome();
    }

    // The role view (games / tech) a visitor arrived on. Visitors can only
    // switch between it and Milestones; the other role view is reachable
    // only by editing the URL. While on Milestones, `role` keeps the home view.
    function getHome() {
      const params = new URLSearchParams(location.search);
      const v = params.get('view');
      if (v === 'games' || v === 'tech') return v;
      return params.get('role') === 'tech' ? 'tech' : 'games';
    }

    function pushParam(f) {
      const u = new URL(location.href);
      u.searchParams.set('view', f);
      if (f === 'achievements' && HOME === 'tech') u.searchParams.set('role', 'tech');
      else u.searchParams.delete('role');
      history.pushState({}, '', u);
    }

    function resolveKey(f) {
      if (f === 'tech') return 'tech';
      return 'games';
    }

    function renderSkillTag(skill) {
      const type = SOFT_SKILLS.has(skill) ? 'soft' : 'hard';
      return `<span class="skill-tag ${type}">${skill}</span>`;
    }

    // ── SKILLS TICKER ────────────────────────────────────────────
    // Every skill from the header lists and projects, deduplicated
    // (case-insensitive), scrolling like TV captions. The group is
    // rendered twice so the -50% loop is seamless.
    const SKILL_ALIASES = { 'Stakeholder Comm.': 'Stakeholder Communication', 'LEAN': 'Lean' };
    const TICKER_SPEED = 40; // scroll speed in pixels per second

    function buildSkillsTicker() {
      const track = document.querySelector('.js-skills-track');
      if (!track) return;
      const seen = new Map();
      [
        ...Object.values(HEADER_SKILLS).flat(),
        ...PROJECTS.flatMap(p => p.skills || []),
        ...SOFT_SKILLS_LIST
      ].forEach(raw => {
        const s = SKILL_ALIASES[raw] || raw;
        const k = s.toLowerCase();
        if (!seen.has(k)) seen.set(k, s);
      });
      const group = [...seen.values()].map(renderSkillTag).join('');
      track.innerHTML = `<div class="skills-group">${group}</div>` +
        `<div class="skills-group" aria-hidden="true">${group}</div>`;

      // Duration = one group's width / speed, so the speed stays the same
      // however many skills there are. Re-measured once fonts load.
      // On mobile the line runs vertically, so measure height there instead.
      const mobile = window.matchMedia('(max-width: 767px)');
      const setDuration = () => {
        const g = track.firstElementChild;
        const len = mobile.matches ? g.offsetHeight : g.offsetWidth;
        if (len) track.style.animationDuration = (len / TICKER_SPEED) + 's';
      };
      setDuration();
      document.fonts?.ready.then(setDuration);
      mobile.addEventListener('change', setDuration);
    }

    // ── BUILD ACCORDION ──────────────────────────────────────────

    const MOBILE = window.matchMedia('(max-width: 767px)');

    function buildAccordion() {
      const root = document.getElementById('accordion');
      PROJECTS.forEach((p, i) => {
        const panel = document.createElement('div');
        // On mobile every entry starts collapsed.
        panel.className = 'panel' + (p.featured ? ' panel--featured' : '') + (i === 0 && !MOBILE.matches ? ' open' : '');
        panel.id = 'p' + i;

        panel.innerHTML = `
      <div class="panel-fill" style="background:${p.color}"></div>

      <div class="panel-spine">
        <div class="spine-code">${p.code}</div>
        <div class="spine-title">${p.title.toUpperCase()}</div>
        <div class="spine-dot"></div>
      </div>

      <div class="panel-content" style="border-top: 3px solid ${p.color}">
        <div class="c-header">
          <div>
            <div class="c-code">${p.code} // ${p.subtitle}</div>
            <div class="c-title">${p.link ? `<a class="c-title-link" href="${p.link}" target="_blank" rel="noopener">${p.title}</a>` : p.title}</div>
            <div class="c-role js-role"></div>
          </div>
          <div class="c-right">
            <div class="c-date">${p.date}</div>
            <div class="c-status">${p.status}</div>
          </div>
        </div>

        <div class="c-img${p.youtube ? ' c-img--yt' : ''}" style="background:${p.color}18; border: 1px solid ${p.color}35">
          ${p.youtube
            ? `<iframe class="c-img-video" src="${p.youtube}" title="${p.title}"
                 allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                 referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`
            : (p.canva || p.pdf)
              ? `${p.image ? `<img src="${p.image}" alt="${p.title}" class="c-img-photo c-img-cover">` : ''}
               <button class="c-img-deck" onclick="openCanva(event, ${i})">
                 <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="14" rx="1"/><path d="M8 21h8M12 17v4"/></svg>
                 ${p.btnLabel || (p.pdf || (p.canva && p.canva.length === 1) ? 'View Presentation' : 'View Presentations')}
               </button>`
              : p.image
                ? `<img src="${p.image}" alt="${p.title}" class="c-img-photo${p.cover ? ' c-img-cover' : ''}">`
                : `<span class="c-img-lbl" style="color:${p.color}aa">Image Placeholder</span>`}
        </div>

        ${p.clip ? `
        <div class="c-media-row">
          <video class="c-clip" src="${p.clip}" autoplay muted loop playsinline preload="metadata"></video>
          <div class="c-skills">
            ${p.skills.map(s => renderSkillTag(s)).join('')}
          </div>
        </div>` : ''}

        <div class="c-org">${p.org}</div>
        <ul class="c-bullets js-bullets"></ul>
        ${p.clip ? '' : `<div class="c-skills">
          ${p.skills.map(s => renderSkillTag(s)).join('')}
        </div>`}
      </div>
    `;

        panel.addEventListener('click', (e) => {
          const open = panel.classList.contains('open');
          if (MOBILE.matches) {
            // Mobile: entries toggle independently. Collapse only via the
            // header, so taps on links, videos and buttons don't close it.
            if (!open) panel.classList.add('open');
            else if (e.target.closest('.c-header') && !e.target.closest('a')) panel.classList.remove('open');
            return;
          }
          if (!open) openPanel(i);
        });

        root.appendChild(panel);
      });
    }

    function playVideo(e, url) {
      e.stopPropagation();
      const box = e.currentTarget.closest('.c-img');
      const sep = url.includes('?') ? '&' : '?';
      box.innerHTML = `<iframe class="c-img-video" src="${url}${sep}autoplay=1"
        frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    }

    let canvaTimer = null;
    let canvaIdx = 0;
    let canvaDecks = [];

    const PDF_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    function renderPdf(url) {
      const wrap = document.getElementById('canva-frame-wrap');
      const scroll = document.getElementById('pdf-scroll');
      wrap.style.display = 'none';
      scroll.style.display = 'block';
      scroll.innerHTML = '';
      scroll.scrollTop = 0;
      if (!window.pdfjsLib) {
        scroll.innerHTML = '<p class="pdf-msg">PDF viewer failed to load.</p>';
        return;
      }
      pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER;
      pdfjsLib.getDocument(url).promise.then(pdf => {
        for (let n = 1; n <= pdf.numPages; n++) {
          const canvas = document.createElement('canvas');
          canvas.className = 'pdf-page';
          scroll.appendChild(canvas);
          pdf.getPage(n).then(page => {
            const vp = page.getViewport({ scale: 2 });
            canvas.width = vp.width;
            canvas.height = vp.height;
            page.render({ canvasContext: canvas.getContext('2d'), viewport: vp });
          });
        }
      }).catch(() => {
        scroll.innerHTML = '<p class="pdf-msg">Could not load PDF.</p>';
      });
    }

    function showCanvaDeck(n) {
      canvaIdx = (n + canvaDecks.length) % canvaDecks.length;
      const url = canvaDecks[canvaIdx];
      if (/\.pdf($|\?|#)/i.test(url)) {
        renderPdf(url);
      } else {
        document.getElementById('pdf-scroll').style.display = 'none';
        const wrap = document.getElementById('canva-frame-wrap');
        wrap.style.display = 'block';
        document.getElementById('canva-frame').src = url;
      }
      document.querySelectorAll('.canva-dot').forEach((d, i) =>
        d.classList.toggle('active', i === canvaIdx)
      );
    }

    function cycleCanva(n, restart) {
      showCanvaDeck(canvaIdx + n);
      if (restart) startCanvaAuto();
    }

    function startCanvaAuto() {
      clearInterval(canvaTimer);
      if (canvaDecks.length > 1) {
        canvaTimer = setInterval(() => showCanvaDeck(canvaIdx + 1), 12000);
      }
    }

    function openModalDecks(decks) {
      canvaDecks = decks;
      canvaIdx = 0;
      const modal = document.getElementById('canva-modal');
      const dots = modal.querySelector('.canva-dots');
      dots.innerHTML = canvaDecks.map((_, i) =>
        `<button class="canva-dot" onclick="cycleCanva(${i} - canvaIdx, true)" aria-label="Deck ${i + 1}"></button>`
      ).join('');
      modal.querySelector('.canva-nav').style.display = canvaDecks.length > 1 ? '' : 'none';
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
      showCanvaDeck(0);
      startCanvaAuto();
    }

    function openCanva(e, projIdx) {
      e.stopPropagation();
      const proj = PROJECTS[projIdx];
      openModalDecks(proj.canva || [proj.pdf]);
    }

    function closeCanva() {
      clearInterval(canvaTimer);
      const modal = document.getElementById('canva-modal');
      modal.classList.remove('open');
      document.getElementById('canva-frame').src = 'about:blank';
      document.getElementById('pdf-scroll').innerHTML = '';
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const m = document.getElementById('canva-modal');
        if (m && m.classList.contains('open')) closeCanva();
      }
    });

    function openPanel(idx) {
      document.querySelectorAll('.panel').forEach((p, i) =>
        p.classList.toggle('open', i === idx)
      );
      const clip = document.getElementById('photo-clip');
      if (clip) {
        clip.classList.remove('swaying');
        void clip.offsetWidth;
        clip.classList.add('swaying');
      }
    }

    // ── APPLY FILTER ─────────────────────────────────────────────

    function applyFilter(f, push = true) {
      document.querySelectorAll('.filter-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.filter === f)
      );

      const heroContent = document.getElementById('hero-content');
      const heroMilestones = document.getElementById('hero-milestones-full');

      const heroEl = document.querySelector('.hero');
      const secLabel = document.getElementById('sec-label');
      const archiveWrap = document.querySelector('.accordion-wrap');
      if (f === 'achievements') {
        if (heroContent) heroContent.hidden = true;
        if (heroMilestones) heroMilestones.hidden = false;
        heroEl?.classList.add('hero--milestones');
        msSnapOpacity();
        // Achievements view stands on its own — hide the project archive below.
        if (secLabel) secLabel.hidden = true;
        if (archiveWrap) archiveWrap.hidden = true;
      } else {
        if (heroContent) heroContent.hidden = false;
        if (heroMilestones) heroMilestones.hidden = true;
        heroEl?.classList.remove('hero--milestones');
        if (secLabel) secLabel.hidden = false;
        if (archiveWrap) archiveWrap.hidden = false;

        document.getElementById('hero-bio').innerHTML = HERO[f] || HERO.all;

        const key = resolveKey(f);
        let visibleCount = 0;
        let firstVisible = -1;
        PROJECTS.forEach((p, i) => {
          const panel = document.getElementById('p' + i);
          if (!panel) return;
          const hide = Array.isArray(p.hideIn) && p.hideIn.includes(f);
          panel.hidden = hide;
          if (hide) return;
          if (firstVisible === -1) firstVisible = i;
          visibleCount++;
          panel.querySelector('.js-role').textContent = p.roles[key];
          panel.querySelector('.js-bullets').innerHTML =
            p.bullets[key].map(b => `<li>${b}</li>`).join('');
        });

        if (secLabel) secLabel.textContent = `Archive Log // ${visibleCount} Projects`;

        // If the currently open panel was hidden in this view, open the first visible one.
        const openEl = document.querySelector('.panel.open');
        if ((!openEl || openEl.hidden) && firstVisible !== -1 && !MOBILE.matches) openPanel(firstVisible);
      }

      if (push) pushParam(f);
    }

    // ── INIT ─────────────────────────────────────────────────────

    const HOME = getHome();
    document.querySelectorAll('.filter-btn').forEach(b => {
      const f = b.dataset.filter;
      if ((f === 'games' || f === 'tech') && f !== HOME) b.remove();
    });

    buildAccordion();
    buildMilestonesView();
    buildSkillsTicker();
    applyFilter(getParam(), false);

    document.querySelectorAll('.filter-btn').forEach(b =>
      b.addEventListener('click', () => applyFilter(b.dataset.filter))
    );

    window.addEventListener('popstate', () => applyFilter(getParam(), false));

    // ── PHOTO FOCUS MODE ─────────────────────────────────────────
    // Click the photo to flip it to the note, float it to the centre of the
    // screen, and dim the rest of the site. Click again / backdrop / Esc closes.
    (function () {
      const clip = document.getElementById('photo-clip');
      const btn = document.getElementById('photo-flip');
      const backdrop = document.getElementById('focus-backdrop');
      if (!clip || !btn || !backdrop) return;

      let open = false;

      // Transform that flies the resting card to the viewport centre and scales
      // it up. Measured against the *untransformed* layout box so the maths is
      // independent of the card's resting tilt; keeps transform-origin at the
      // CSS default (top center) so the open/close tween stays smooth.
      function centerTransform() {
        const prev = clip.style.transform;
        const prevTrans = clip.style.transition;
        clip.style.transition = 'none';
        clip.style.transform = 'none';
        const r = clip.getBoundingClientRect();
        clip.style.transform = prev;
        clip.style.transition = prevTrans;
        const scale = Math.min(
          2.0,
          (window.innerHeight * 0.82) / r.height,
          (window.innerWidth * 0.92) / r.width
        );
        const dx = window.innerWidth / 2 - (r.left + r.width / 2);
        const dy = window.innerHeight / 2 - r.top - scale * r.height / 2;
        return `translate(${dx}px, ${dy}px) scale(${scale})`;
      }

      function openFocus() {
        if (open) return;
        open = true;
        clip.classList.add('hint-dismissed');   // retire the cue after first use
        clip.classList.remove('swaying');
        const target = centerTransform();
        requestAnimationFrame(() => {
          clip.style.transition = 'transform .5s cubic-bezier(.4,0,.2,1)';
          clip.classList.add('focus-active');   // flips the card
          clip.style.transform = target;
          backdrop.classList.add('show');
          btn.setAttribute('aria-pressed', 'true');
        });
      }

      function closeFocus() {
        if (!open) return;
        open = false;
        clip.classList.remove('focus-active');   // flips back
        clip.style.transform = '';               // eases home to the resting tilt
        backdrop.classList.remove('show');
        btn.setAttribute('aria-pressed', 'false');
        setTimeout(() => { if (!open) clip.style.transition = ''; }, 520);
      }

      btn.addEventListener('click', (e) => {
        e.preventDefault();
        open ? closeFocus() : openFocus();
      });
      backdrop.addEventListener('click', closeFocus);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeFocus();
      });
      window.addEventListener('resize', () => {
        if (open) clip.style.transform = centerTransform();
      });
    })();

  </script>
</body>
