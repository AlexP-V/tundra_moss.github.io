  <style>
    :root {
      --bg:       #f2ece0;
      --grid:     rgba(0, 0, 0, 0.055);
      --grid-sz:  22px;
      --ink:      #1a1814;
      --ink-2:    #5c5850;
      --ink-3:    #9e9890;
      --border:   #d0cac0;
      --surface:  #faf7f0;
      --mustard:  #c4953a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background-color: var(--bg);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);

      color: var(--ink);
      min-height: 100vh;

    /* ── HEADER ── */
    header { padding: 2.25rem 3rem 1.5rem; }

    .header-cols {

      grid-template-columns: 1fr auto 1fr;
      gap: 2.5rem;
      align-items: start;
    }
    .header-center {

      justify-content: center;
      padding-top: 1.5rem;

    .header-right {

      align-items: flex-start;
      gap: 1rem;
      padding-top: 0.5rem;
    }

    .eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 0.4rem;
    }

    h1 {

      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 0.95;
    }

    .header-role {

      font-size: 0.66rem;
      letter-spacing: 0.06em;
      color: var(--ink-2);
      margin-top: 0.6rem;
    }

      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mustard);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 1px;
      transition: color .18s, border-color .18s;
    }
    nav a:hover { color: var(--mustard); border-color: var(--mustard); }

    /* ── FILTER BAR ── */
    .filter-bar {
      padding: 0 3rem;
      display: flex;
      border-bottom: 1px solid var(--border);
    }

    .filter-btn {
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 0.65rem 1.4rem 0.55rem;
      cursor: pointer;
      margin-bottom: -1px;
      transition: color .18s;
    }
    .filter-btn:hover { color: var(--mustard); }
    .filter-btn.active { color: var(--mustard); border-bottom-color: var(--mustard); }

    /* ── PHOTO CLIP ── */
    .photo-clip {
      position: relative;
      width: 224px;
      transform: rotate(-2.5deg) translateX(8px);
      transform-origin: top center;
      filter: drop-shadow(3px 6px 14px rgba(0,0,0,0.14));
    }
    .photo-clip img {
      width: 100%;
      height: auto;
      display: block;
    }
    .paperclip {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      pointer-events: none;
    }

    @keyframes sway {
      0%   { transform: rotate(-2.5deg) translateX(8px); }
      18%  { transform: rotate(4.5deg)  translateX(8px); }
      36%  { transform: rotate(-5.5deg) translateX(8px); }
      54%  { transform: rotate(3deg)    translateX(8px); }
      72%  { transform: rotate(-3.5deg) translateX(8px); }
      88%  { transform: rotate(-2deg)   translateX(8px); }
      100% { transform: rotate(-2.5deg) translateX(8px); }
    }
    .photo-clip.swaying {
      animation: sway 0.9s cubic-bezier(.4, 0, .2, 1);
    }

    /* ── HERO ── */
    .hero {
      padding: 2rem 3rem 1.5rem;
      max-width: 900px;
    }

      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    /* ── ACCORDION ── */
    .accordion-wrap { padding: 0 3rem 3rem; }

    .accordion {
      display: flex;
      gap: 2px;
      height: calc(100vh - 370px);
      min-height: 460px;
      max-height: 660px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .panel {
      position: relative;
      flex: 0 0 52px;
      overflow: hidden;
      cursor: pointer;
      transition: flex .52s cubic-bezier(.4, 0, .2, 1);
      border-right: 1px solid rgba(0,0,0,.07);
    }
    .panel:last-child { border-right: none; }
    .panel.open { flex: 1; cursor: default; }

    /* color fill (solid when collapsed, hidden behind content when open) */
    .panel-fill {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    /* ── SPINE (collapsed) ── */
    .panel-spine {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 0;
      opacity: 1;
      transition: opacity .15s;
      pointer-events: none;
    }
    .panel.open .panel-spine { opacity: 0; }

    .spine-code {
      font-family: 'Space Mono', monospace;
      font-size: 0.48rem;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,.5);
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }
    .spine-title {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: rgba(255,255,255,.92);
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      white-space: nowrap;
    }
    .spine-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,.3);
    }

    /* ── CONTENT (expanded) ── */
    .panel-content {
      position: absolute;
      inset: 0;
      z-index: 2;
      padding: 1.75rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease .28s;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--surface);
      background-image:
        linear-gradient(rgba(0,0,0,.038) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,.038) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .panel.open .panel-content { opacity: 1; pointer-events: all; }

    .panel-content::-webkit-scrollbar { width: 3px; }
    .panel-content::-webkit-scrollbar-track { background: transparent; }
    .panel-content::-webkit-scrollbar-thumb { background: var(--border); }

    .c-header {
      display: flex;

    .c-bullets { list-style: none; margin-bottom: 1.2rem; }

      line-height: 1.62;

    .c-bullets li::before {

    .c-skills { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .skill-tag {

      letter-spacing: 0.1em;
      text-transform: uppercase;

    /* ── FOOTER ── */

      padding: 1.5rem 3rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 2rem;

      font-size: 0.56rem;
      letter-spacing: 0.08em;
      color: var(--mustard);

      .header-center { justify-content: flex-start; padding-top: 0; }
      h1 { font-size: 2rem; }
      .filter-bar, .sec-label, .accordion-wrap { padding-left: 1.5rem; padding-right: 1.5rem; }
      .hero { padding: 1.5rem; }

      .panel-spine { display: none; }
      .panel-fill { height: 3px; bottom: auto; }
      .panel-content {
        position: static;
        opacity: 1 !important;
        pointer-events: all !important;
        transition: none;
      }
      footer { padding: 1.5rem; flex-direction: column; align-items: flex-start; gap: 1rem; }

  </style>
</head>

function getParam() {
  const v = new URLSearchParams(location.search).get('view');
  return ['games', 'tech'].includes(v) ? v : 'all';
}

function pushParam(f) {
  const u = new URL(location.href);
  if (f === 'all') u.searchParams.delete('view');

  history.pushState({}, '', u);
}

      <div class="panel-spine">
        <div class="spine-code">${p.code}</div>
        <div class="spine-title">${p.title.toUpperCase()}</div>
        <div class="spine-dot"></div>
      </div>

      <div class="panel-content" style="border-top: 3px solid ${p.color}">
        <div class="c-header">
          <div>
            <div class="c-code">${p.code} // ${p.subtitle}</div>
            <div class="c-title">${p.title}</div>
            <div class="c-role js-role"></div>
          </div>
          <div class="c-right">
            <div class="c-date">${p.date}</div>
            <div class="c-status">${p.status}</div>
          </div>
        </div>

        <div class="c-img" style="background:${p.color}18; border: 1px solid ${p.color}35">
          <span class="c-img-lbl" style="color:${p.color}aa">Image Placeholder</span>
        </div>

        <div class="c-org">${p.org}</div>
        <ul class="c-bullets js-bullets"></ul>
        <div class="c-skills">
          ${p.skills.map(s => `<span class="skill-tag">${s}</span>`).join('')}
        </div>
      </div>
    `;

    panel.addEventListener('click', () => {
      if (!panel.classList.contains('open')) openPanel(i);
    });

    root.appendChild(panel);
  });
}

function openPanel(idx) {
  document.querySelectorAll('.panel').forEach((p, i) =>
    p.classList.toggle('open', i === idx)
  );
  const clip = document.getElementById('photo-clip');
  if (clip) {
    clip.classList.remove('swaying');
    void clip.offsetWidth;
    clip.classList.add('swaying');
  }
}

// ── APPLY FILTER ─────────────────────────────────────────────

function applyFilter(f, push = true) {
  document.querySelectorAll('.filter-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.filter === f)
  );

  document.getElementById('hero-bio').textContent = HERO[f] || HERO.all;

  const headerSkills = document.querySelector('.js-header-skills');
  if (headerSkills) {
    headerSkills.innerHTML = (HEADER_SKILLS[f] || HEADER_SKILLS.all)
      .map(s => `<span class="skill-tag">${s}</span>`).join('');
  }

  const key = resolveKey(f);
  PROJECTS.forEach((p, i) => {
    const panel = document.getElementById('p' + i);
    if (!panel) return;
    panel.querySelector('.js-role').textContent = p.roles[key];
    panel.querySelector('.js-bullets').innerHTML =
      p.bullets[key].map(b => `<li>${b}</li>`).join('');
  });

  if (push) pushParam(f);
}

// ── INIT ─────────────────────────────────────────────────────

buildAccordion();
applyFilter(getParam(), false);

document.querySelectorAll('.filter-btn').forEach(b =>
  b.addEventListener('click', () => applyFilter(b.dataset.filter))
);

window.addEventListener('popstate', () => applyFilter(getParam(), false));
</script>
</body>
</html>
