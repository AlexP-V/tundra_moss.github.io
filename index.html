<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aleksandra Pavlova-Verevkina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Londrina+Shadow&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #f2ece0;
      --grid: rgba(0, 0, 0, 0.055);
      --grid-sz: 22px;
      --ink: #1a1814;
      --ink-2: #5c5850;
      --ink-3: #9e9890;
      --border: #d0cac0;
      --surface: #faf7f0;
      --mustard: #c4953a;
      --soft-bg: #f1e3cf;
      --soft-bd: #d7c2a5;
      --soft-ink: #8a6a43;
      --hard-bg: #e4ebf0;
      --hard-bd: #b7c6d4;
      --hard-ink: #475b6e;
    }

    html {
      font-size: 110%;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background-color: var(--bg);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: var(--grid-sz) var(--grid-sz);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      padding: 2.25rem 3rem 1.5rem;
    }

    .header-cols {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4rem;
      align-items: center;
    }

    .header-center {
      display: flex;
      justify-content: flex-start;
      padding-top: 0.5rem;
    }

    .eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-family: 'Londrina Shadow', 'Space Grotesk', sans-serif;
      font-size: clamp(3rem, 7.2vw, 8.5rem);
      font-weight: 400;
      letter-spacing: 0.01em;
      line-height: 0.95;
    }

    .header-role {
      font-family: 'Space Mono', monospace;
      font-size: clamp(0.95rem, 1.9vw, 1.7rem);
      letter-spacing: 0.06em;
      color: var(--ink);
      margin-top: 1rem;
      display: inline-block;
      background: linear-gradient(103deg,
          transparent 1.8%,
          rgba(255, 228, 25, 0.497) 2.4%,
          rgba(255, 224, 15, 0.72) 38%,
          rgba(255, 231, 28, 0.83) 63%,
          rgba(255, 223, 18, 0.354) 96.5%,
          transparent 97.5%);
      padding: 0.08em 0.22em 0.06em;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }

    /* Name block on the left, contact icons in the free space to its right */
    .header-left {
      display: flex;
      align-items: center;
      gap: 3rem;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    nav a {
      display: flex;
      color: var(--mustard);
      transition: color .18s, transform .18s;
    }

    nav a svg {
      width: clamp(4rem, 6.4vw, 6rem);
      height: clamp(4rem, 6.4vw, 6rem);
    }

    /* Playful tilt — each icon leans a different way */
    nav a:nth-child(1) {
      transform: rotate(-8deg);
    }

    nav a:nth-child(2) {
      transform: rotate(6deg);
    }

    nav a:hover,
    nav a:focus-visible {
      color: var(--ink);
      transform: rotate(0deg) scale(1.08);
    }

    /* ── SKILLS TICKER ── */
    .skills-ticker {
      overflow: hidden;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 0.55rem 0;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
    }

    .skills-track {
      display: flex;
      width: max-content;
      animation: ticker 60s linear infinite;
    }

    .skills-ticker:hover .skills-track {
      animation-play-state: paused;
    }

    .skills-group {
      display: flex;
      gap: 0.5rem;
      padding-right: 0.5rem;
      flex-shrink: 0;
    }

    .skills-group .skill-tag {
      white-space: nowrap;
      font-size: 0.8rem;
    }

    @keyframes ticker {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    @keyframes ticker-v {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-50%);
      }
    }

    /* Mobile: the line becomes a vertical strip pinned to the left edge */
    @media (max-width: 767px) {
      body {
        padding-left: 2.6rem;
      }

      .skills-ticker {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: 2.6rem;
        z-index: 50;
        background: var(--bg);
        border: none;
        border-right: 1px solid var(--border);
        padding: 0 0.4rem;
        -webkit-mask-image: linear-gradient(180deg, transparent, #000 4%, #000 96%, transparent);
        mask-image: linear-gradient(180deg, transparent, #000 4%, #000 96%, transparent);
      }

      .skills-track {
        flex-direction: column;
        width: auto;
        animation-name: ticker-v;
      }

      .skills-group {
        flex-direction: column;
        align-items: center;
        padding-right: 0;
        padding-bottom: 0.5rem;
      }

      .skills-group .skill-tag {
        writing-mode: vertical-rl;
        font-size: 0.7rem;
        padding: 0.7rem 0.28rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .skills-ticker {
        overflow-x: auto;
        overflow-y: auto;
      }

      .skills-track {
        animation: none;
      }
    }

    /* ── FILTER BAR ── */
    .filter-bar {
      padding: 0 3rem;
      display: flex;
      border-bottom: 1px solid var(--border);
    }

    .filter-btn {
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 0.65rem 1.4rem 0.55rem;
      cursor: pointer;
      margin-bottom: -1px;
      transition: color .18s;
    }

    .filter-btn:hover {
      color: var(--mustard);
    }

    .filter-btn.active {
      color: var(--mustard);
      border-bottom-color: var(--mustard);
    }

    /* ── PHOTO CLIP ── */
    .photo-clip {
      position: relative;
      width: 224px;
      transform: rotate(-2.5deg) translateX(8px);
      transform-origin: top center;
      filter: drop-shadow(3px 6px 14px rgba(0, 0, 0, 0.14));
      perspective: 900px;
      z-index: 1;
    }

    /* While focus mode is active the clip is lifted above the dim backdrop
       (its centring transform is driven inline from JS). */
    .photo-clip.focus-active {
      z-index: 1000;
    }

    /* ── CLICK HINT ── cursor-click icon tucked at the photo's corner */
    .photo-hint {
      position: absolute;
      right: -30px;
      bottom: -26px;
      z-index: 3;
      pointer-events: none;
      color: var(--mustard);
      transform-origin: top left;
      animation: hint-bob 1.7s ease-in-out infinite;
      transition: opacity .35s;
    }

    .photo-hint-icon {
      display: block;
      filter: drop-shadow(1px 2px 3px rgba(0, 0, 0, 0.18));
    }

    @keyframes hint-bob {

      0%,
      100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(-4px, -4px);
      }
    }

    /* Hide the cue while the note is open, and for good once it's been used. */
    .photo-clip.focus-active .photo-hint,
    .photo-clip.hint-dismissed .photo-hint {
      opacity: 0;
    }

    .photo-clip.hint-dismissed .photo-hint {
      pointer-events: none;
      animation: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .photo-hint {
        animation: none;
      }
    }

    .photo-flip {
      all: unset;
      display: block;
      width: 100%;
      cursor: pointer;
    }

    .photo-flip:focus-visible {
      outline: 2px solid var(--mustard);
      outline-offset: 4px;
    }

    .photo-card {
      position: relative;
      width: 100%;
      display: block;
      transform-style: preserve-3d;
      transition: transform .55s cubic-bezier(.4, 0, .2, 1);
    }

    /* Card flips to the note only in focus mode (click to open). A subtle
       hover cue hints it's interactive without committing the flip. */
    .photo-clip:not(.focus-active):hover .photo-card {
      transform: translateY(-3px);
    }

    .photo-clip.focus-active .photo-card {
      transform: rotateY(180deg);
    }

    /* ── FOCUS BACKDROP ── dims the rest of the site while the note is open */
    .focus-backdrop {
      position: fixed;
      inset: 0;
      z-index: 900;
      background: rgba(20, 16, 12, 0.62);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .45s ease;
    }

    .focus-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    .photo-face {
      width: 100%;
      height: 100%;
      display: block;
      backface-visibility: hidden;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: #fff;
    }

    .photo-front {
      position: relative;
      z-index: 1;
    }

    .photo-back {
      position: absolute;
      inset: 0;
      transform: rotateY(180deg);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.7rem;
      overflow: hidden;
    }

    .note {
      width: 100%;
      height: 100%;
      border: none;
      padding: 0.6rem;
      background: repeating-linear-gradient(0deg,
          rgba(0, 0, 0, 0.04) 0,
          rgba(0, 0, 0, 0.04) 1px,
          transparent 1px,
          transparent 14px);
      font-family: 'Caveat', 'Space Mono', monospace;
      color: var(--ink-2);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      overflow: hidden;
    }

    .note-title {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .note-text {
      font-size: 0.82rem;
      line-height: 1.2;
    }

    .note-sign {
      margin-top: auto;
      font-size: 0.85rem;
      text-align: right;
    }

    .photo-clip img {
      width: 100%;
      height: auto;
      display: block;
    }

    .paperclip {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      pointer-events: none;
    }

    @keyframes sway {
      0% {
        transform: rotate(-2.5deg) translateX(8px);
      }

      18% {
        transform: rotate(4.5deg) translateX(8px);
      }

      36% {
        transform: rotate(-5.5deg) translateX(8px);
      }

      54% {
        transform: rotate(3deg) translateX(8px);
      }

      72% {
        transform: rotate(-3.5deg) translateX(8px);
      }

      88% {
        transform: rotate(-2deg) translateX(8px);
      }

      100% {
        transform: rotate(-2.5deg) translateX(8px);
      }
    }

    .photo-clip.swaying {
      animation: sway 0.9s cubic-bezier(.4, 0, .2, 1);
    }

    /* ── HERO ── */
    .hero {
      padding: 2rem 3rem 1.5rem;
      max-width: 900px;
    }

    .bio {
      font-size: 0.88rem;
      line-height: 1.65;
      color: var(--ink-2);
      max-width: 580px;
    }

    /* ── WIP NOTE ── one long card: footage left, text right. Matches the
       archive's gutters so it lines up with the project cards below. */
    .wip-clip {
      padding: 0.6rem 3rem 2.4rem;
    }

    /* An author `display` beats the UA rule for [hidden], so restate it;
       the milestones view hides this card. */
    .wip-clip[hidden] {
      display: none;
    }

    .wip-note {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1.1rem;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.35fr);
      gap: 1.4rem;
      align-items: start;
      min-height: 290px;
      filter: drop-shadow(3px 6px 14px rgba(0, 0, 0, 0.14));
      background-image: repeating-linear-gradient(0deg,
          rgba(0, 0, 0, 0.035) 0,
          rgba(0, 0, 0, 0.035) 1px,
          transparent 1px,
          transparent 15px);
    }

    .wip-text {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      padding: 0.3rem 0.4rem 0 0;
    }

    /* Only these two sit under the sticker, so only they need the clearance. */
    .wip-eyebrow,
    .wip-title {
      padding-right: 8.5rem;
    }

    /* Sits along the card's top edge, in from the right corner. */
    .wip-star {
      position: absolute;
      top: -30px;
      right: 40px;
      width: 92px;
      height: 92px;
      transform: rotate(13deg);
      z-index: 3;
      pointer-events: none;
    }

    .wip-star text {
      font-family: 'Space Mono', monospace;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 0.06em;
      fill: var(--bg);
    }

    .wip-eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    .wip-title {
      font-size: 1.15rem;
      line-height: 1.25;
      color: var(--ink);
    }

    .wip-status {
      font-family: 'Caveat', 'Space Mono', monospace;
      font-size: 1.57rem;
      line-height: 1.2;
      color: color-mix(in srgb, var(--ink-2) 80%, var(--bg));
    }

    /* Same treatment as the footer links. */
    .wip-status a {
      color: var(--mustard);
      text-decoration: none;
      transition: color .15s;
    }

    .wip-status a:hover {
      color: var(--ink);
    }

    /* 16:9 frame: fills its note, stays a tidy empty frame until there is
       footage to put in it. */
    .wip-media {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 1px solid var(--border);
      background: var(--soft-bg);
      overflow: hidden;
    }

    /* Absolutely positioned so a large clip or still never widens the
       frame: the footage fills the prepared 16:9 area instead of setting
       its size from its own pixel dimensions. */
    .wip-media video,
    .wip-media img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .wip-media--empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: var(--ink-3);
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .wip-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-top: 0.15rem;
    }

    /* Same size as the tags on the ticker up top. */
    .wip-tags .skill-tag {
      font-size: 0.8rem;
      padding: 0.28rem 0.7rem;
    }

    /* ── SECTION LABEL ── */
    .sec-label {
      padding: 0.4rem 3rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    /* ── ACCORDION ── */
    .accordion-wrap {
      padding: 0 3rem 3rem;
    }

    .accordion {
      display: flex;
      gap: 2px;
      height: calc(100vh - 370px);
      min-height: 460px;
      max-height: 660px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .panel {
      position: relative;
      flex: 0 0 52px;
      overflow: hidden;
      cursor: pointer;
      transition: flex .52s cubic-bezier(.4, 0, .2, 1);
      border-right: 1px solid rgba(0, 0, 0, .07);
    }

    .panel:last-child {
      border-right: none;
    }

    .panel.open {
      flex: 1;
      cursor: default;
    }

    /* color fill (solid when collapsed, hidden behind content when open) */
    .panel-fill {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    /* Featured (paid job) entry: white cover with a navy outline so it stands
       out from the warm project covers. */
    .panel--featured .panel-fill {
      background: #fff !important;
      box-shadow: inset 0 0 0 2px #2f4a6e;
    }

    .panel--featured .spine-code {
      color: rgba(47, 74, 110, .6);
    }

    .panel--featured .spine-title {
      color: #2f4a6e;
    }

    .panel--featured .spine-dot {
      background: rgba(47, 74, 110, .45);
    }

    /* ── SPINE (collapsed) ── */
    .panel-spine {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 0;
      opacity: 1;
      transition: opacity .15s;
      pointer-events: none;
    }

    .panel.open .panel-spine {
      opacity: 0;
    }

    .spine-code {
      font-family: 'Space Mono', monospace;
      font-size: 0.48rem;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, .5);
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    .spine-title {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, .92);
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      white-space: nowrap;
    }

    .spine-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .3);
    }

    /* ── CONTENT (expanded) ── */
    .panel-content {
      position: absolute;
      inset: 0;
      z-index: 2;
      padding: 1.75rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease .28s;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--surface);
      background-image:
        linear-gradient(rgba(0, 0, 0, .038) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, .038) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .panel.open .panel-content {
      opacity: 1;
      pointer-events: all;
    }

    .panel-content::-webkit-scrollbar {
      width: 3px;
    }

    .panel-content::-webkit-scrollbar-track {
      background: transparent;
    }

    .panel-content::-webkit-scrollbar-thumb {
      background: var(--border);
    }

    .c-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1.2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .c-code {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 0.3rem;
    }

    .c-title {
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .c-role {
      font-family: 'Space Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.06em;
      color: var(--ink-2);
      margin-top: 0.4rem;
    }

    .c-right {
      text-align: right;
      flex-shrink: 0;
    }

    .c-date {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.06em;
      color: var(--ink-3);
      white-space: nowrap;
    }

    .c-status {
      font-family: 'Space Mono', monospace;
      font-size: 0.5rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-top: 0.25rem;
      opacity: 0.65;
    }

    .c-img {
      width: 100%;
      height: 128px;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .c-img-video {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .c-img-play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.7);
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding-left: 3px;
      transition: background 0.2s, transform 0.2s;
    }

    .c-img-play:hover {
      background: rgba(0, 0, 0, 0.78);
      transform: translate(-50%, -50%) scale(1.08);
    }

    .c-img-deck {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 0.9rem;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: background 0.2s, transform 0.2s;
    }

    .c-img-deck:hover {
      background: rgba(0, 0, 0, 0.78);
      transform: translate(-50%, -50%) scale(1.05);
    }

    .canva-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(10, 8, 6, 0.88);
      backdrop-filter: blur(4px);
      padding: 2.5rem 1.5rem;
    }

    .canva-modal.open {
      display: flex;
    }

    .canva-box {
      width: min(1000px, 100%);
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      position: relative;
    }

    .canva-close {
      position: absolute;
      top: -2rem;
      right: 0;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.8rem;
      line-height: 1;
      cursor: pointer;
      opacity: 0.8;
    }

    .canva-close:hover {
      opacity: 1;
    }

    .canva-frame-wrap {
      position: relative;
      width: 100%;
      padding-top: 62.5%;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .canva-frame-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .pdf-scroll {
      display: none;
      max-height: 82vh;
      overflow-y: auto;
      border-radius: 6px;
      background: #1c1814;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      padding: 0.6rem;
    }

    .pdf-page {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 2px;
    }

    .pdf-page+.pdf-page {
      margin-top: 0.6rem;
    }

    .pdf-msg {
      color: #cbb89c;
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      text-align: center;
      padding: 2rem;
    }

    .canva-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    .canva-arrow {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      transition: background 0.2s;
    }

    .canva-arrow:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .canva-dots {
      display: flex;
      gap: 0.5rem;
    }

    .canva-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: transparent;
      padding: 0;
      cursor: pointer;
      transition: background 0.2s;
    }

    .canva-dot.active {
      background: #fff;
    }

    .c-img-photo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .c-img-cover {
      object-fit: cover;
    }

    /* Project covers match the clips: capped at 40vh tall, sized to their own
       aspect and centred. Landscape covers end up wider than portrait clips. */
    .panel-content .c-img {
      height: auto;
      max-height: 40vh;
      width: fit-content;
      max-width: 100%;
      margin-left: auto;
      margin-right: auto;
    }

    .c-title-link {
      color: inherit;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.15em;
    }

    .c-title-link:hover {
      color: var(--mustard);
    }

    /* YouTube embeds have no intrinsic size: fill the width at 16:9,
       still capped at 40vh tall like the other covers. */
    .panel-content .c-img--yt {
      width: min(100%, calc(40vh * 16 / 9));
      aspect-ratio: 16 / 9;
    }

    .panel-content .c-img-photo {
      width: auto;
      height: auto;
      max-height: 40vh;
      max-width: 100%;
    }

    .c-clip {
      display: block;
      width: auto;
      max-width: 100%;
      height: auto;
      max-height: 40vh;
      /* cap portrait clips at 40% of viewport height */
      margin: 0 auto 1rem;
      /* centre the (often narrow) portrait video */
      border-radius: 2px;
      background: #000;
    }

    .c-img-lbl {
      font-family: 'Space Mono', monospace;
      font-size: 0.52rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .c-org {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 0.85rem;
    }

    .c-bullets {
      list-style: none;
      margin-bottom: 1.2rem;
    }

    .c-bullets li {
      display: flex;
      gap: 0.55rem;
      font-size: 0.77rem;
      line-height: 1.62;
      color: var(--ink-2);
      padding: 0.42rem 0;
      border-bottom: 1px solid var(--border);
    }

    /* Postmortem bullet: straight dashed postmark frame, with a sticker
       label on its edge styled like the WIP star (mustard, cream outline, tilt). */
    .c-bullets li.c-lesson {
      position: relative;
      display: block;
      margin: 1.5rem 0.3rem 0.6rem;
      padding: 1.05rem 1rem 0.8rem;
      border: 1.5px dashed rgba(123, 35, 64, 0.6);
      border-radius: 7px;
      background: rgba(123, 35, 64, 0.04);
      color: var(--ink);
    }

    .c-lesson-tag {
      position: absolute;
      top: -0.95rem;
      left: 0.7rem;
      padding: 0.28rem 0.6rem 0.24rem;
      background: var(--mustard);
      border: 2px solid var(--bg);
      border-radius: 4px;
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--bg);
      line-height: 1.2;
      transform: rotate(-5deg);
      filter: drop-shadow(1px 2px 3px rgba(0, 0, 0, 0.18));
    }

    .c-skills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    /* Video projects: narrow portrait clip on the left, skills filling the
       void to its right instead of sitting at the bottom of the panel. */
    .c-media-row {
      display: flex;
      align-items: flex-start;
      gap: 1.5rem;
      margin-bottom: 1rem;
    }

    .c-media-row .c-clip {
      flex: 0 0 auto;
      margin: 0;
    }

    .c-media-row .c-skills {
      flex: 1;
      align-content: flex-start;
    }

    .skill-tag {
      font-family: 'Space Mono', monospace;
      font-size: 1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-3);
      /* background: var(--soft-bg); */
      border: 1px solid var(--border);
      padding: 0.28rem 0.7rem;
      transition: color .15s, border-color .15s;
    }

    .skill-tag.soft {
      border-color: var(--soft-bd);
    }

    .skill-tag.hard {
      border-color: var(--hard-bd);
    }

    .skill-tag:hover {
      color: var(--ink);
      border-color: var(--ink-3);
    }

    /* ── FOOTER ── */
    footer {
      padding: 1.5rem 3rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 2rem;
    }

    .footer-name {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    .footer-links {
      display: flex;
      gap: 1.5rem;
    }

    .footer-links a {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.08em;
      color: var(--mustard);
      text-decoration: none;
      transition: color .15s;
    }

    .footer-links a:hover {
      color: var(--ink);
    }

    /* ── MILESTONES ── draggable filmstrip (from Issue 01) */
    .hero-milestones-full {
      --ms-pad: 3rem;
    }

    .ms-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    .strip-wrap {
      margin-top: 0;
      position: relative;
    }

    .strip {
      display: flex;
      gap: 1.1rem;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-padding-left: var(--ms-pad);
      padding: 0.3rem var(--ms-pad) 1.6rem;
      margin: 0 calc(var(--ms-pad) * -1);
      scrollbar-width: thin;
      cursor: grab;
    }

    .strip.dragging {
      cursor: grabbing;
      scroll-snap-type: none;
      user-select: none;
    }

    .frame {
      scroll-snap-align: start;
      flex: 0 0 min(21rem, 78vw);
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 1.1rem 1.2rem 1.3rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .frame-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.6rem;
    }

    .frame-year {
      font-family: 'Londrina Shadow', sans-serif;
      font-size: 1.9rem;
      line-height: 1;
    }

    .frame-seal {
      width: 3.1rem;
      height: 3.1rem;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--soft-bd);
      flex-shrink: 0;
    }

    .frame h4 {
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.32;
    }

    .frame p {
      font-size: 0.85rem;
      line-height: 1.62;
      color: var(--ink-2);
    }

    /* Image slot at the foot of a frame; holds the deck/artbook button
       (.c-img-deck) centred over the picture when a milestone has one. */
    .frame-media {
      position: relative;
      margin-top: auto;
    }

    .frame-media .c-img-deck {
      white-space: nowrap;
    }

    .frame-shot {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border: 1px solid var(--border);
      -webkit-user-drag: none;
    }

    .strip-hint {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 0.2rem;
    }

    .hero--milestones {
      max-width: none;
    }

    /* lavender highlighter — same marker treatment as .header-role */
    .hl {
      color: var(--ink);
      background: linear-gradient(103deg,
          transparent 1.8%,
          rgba(187, 160, 240, 0.244) 2.4%,
          rgba(175, 146, 234, 0.295) 38%,
          rgba(185, 157, 240, 0.355) 63%,
          rgba(179, 150, 236, 0.258) 96.5%,
          transparent 97.5%);
      /* Negative side margins cancel the side padding, so the marker can
         bleed past the words without pushing the next word or punctuation away. */
      padding: 0.06em 0.12em 0.04em;
      margin: 0 -0.12em;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }

    /* ── MILESTONES FILTER BTN ── */
    .filter-btn--milestones {
      color: #7B2340;
      opacity: 0.55;
    }

    .filter-btn--milestones:hover {
      color: #7B2340;
      opacity: 1;
    }

    .filter-btn--milestones.active {
      color: #7B2340;
      opacity: 1;
      border-bottom-color: #7B2340;
    }

    /* ── MOBILE ── */
    @media (max-width: 767px) {

      /* Drop the 110% zoom and clip any stray horizontal overflow so the page
         opens at true device width with no empty gutter on the right. */
      html {
        font-size: 100%;
      }

      html,
      body {
        overflow-x: hidden;
      }

      header {
        padding: 1.5rem 1.5rem 1rem;
      }

      .header-cols {
        grid-template-columns: 1fr;
        gap: 1.25rem;
      }

      .header-center {
        justify-content: flex-start;
        padding-top: 0;
      }

      h1 {
        font-size: 2.6rem;
      }

      .header-role {
        font-size: 0.85rem;
      }

      .header-left {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }

      nav {
        flex-direction: row;
      }

      .filter-bar,
      .sec-label,
      .accordion-wrap {
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }

      /* Filters don't fit on one row — let them scroll sideways instead of
         spilling off-screen, so every tab (incl. Achievements) is reachable. */
      .filter-bar {
        overflow-x: auto;
        flex-wrap: nowrap;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .filter-bar::-webkit-scrollbar {
        display: none;
      }

      .filter-btn {
        flex: 0 0 auto;
        white-space: nowrap;
      }

      .hero {
        padding: 1.5rem;
      }

      .wip-clip {
        padding: 0 1.5rem 1.8rem;
      }

      /* One column: a single 16:9 frame, then the text under it. */
      .wip-media--second {
        display: none;
      }

      .wip-note {
        grid-template-columns: minmax(0, 1fr);
        gap: 1rem;
        min-height: 0;
        transform: rotate(-0.8deg);
      }

      .wip-media {
        width: 100%;
        height: auto;
      }

      .wip-status {
        font-size: 0.98rem;
        line-height: 1.2;
        color: var(--ink-2);
      }

      .wip-tags .skill-tag {
        font-size: 0.58rem;
        padding: 0.2rem 0.45rem;
      }

      .wip-eyebrow,
      .wip-title {
        padding-right: 0;
      }

      /* Room left under the frame for the description. */
      .wip-text {
        min-height: 92px;
        padding: 0 0.2rem 0.3rem;
      }

      /* Kept inside the note's edge on narrow screens so it never lands
         outside the viewport. */
      .wip-star {
        width: 64px;
        height: 64px;
        top: -22px;
        right: 6px;
      }

      /* Milestones strip bleeds to the narrower mobile gutter. */
      .hero-milestones-full {
        --ms-pad: 1.5rem;
      }

      .photo-clip {
        width: 150px;
        transform: rotate(-2deg);
      }

      .note-title {
        font-size: 0.82rem;
      }

      .note-text {
        font-size: 0.72rem;
        line-height: 1.18;
      }

      .note-sign {
        font-size: 0.74rem;
      }

      .accordion {
        flex-direction: column;
        height: auto;
        max-height: none;
        min-height: auto;
        gap: 8px;
      }

      .panel {
        flex: none !important;
        height: auto;
        cursor: default;
        border-right: none;
      }

      .panel-spine {
        display: none;
      }

      .panel-fill {
        height: 3px;
        bottom: auto;
      }

      .panel--featured .panel-fill {
        background: #2f4a6e !important;
        box-shadow: none;
      }

      .panel-content {
        position: static;
        opacity: 1 !important;
        pointer-events: all !important;
        transition: none;
      }

      /* Collapsed entries: a solid coloured bar with the code + title.
         Tap to expand; tap the entry's header to collapse again. */
      .panel:not(.open) {
        cursor: pointer;
      }

      .panel:not(.open) .panel-content {
        display: none;
      }

      .panel:not(.open) .panel-fill {
        bottom: 0;
        height: auto;
      }

      .panel--featured:not(.open) .panel-fill {
        background: #fff !important;
        box-shadow: inset 0 0 0 2px #2f4a6e;
      }

      .panel:not(.open) .panel-spine {
        display: flex;
        position: relative;
        flex-direction: row;
        align-items: center;
        justify-content: flex-start;
        gap: 0.8rem;
        padding: 1rem 1.1rem;
      }

      .panel:not(.open) .spine-code,
      .panel:not(.open) .spine-title {
        writing-mode: horizontal-tb;
        transform: none;
      }

      .panel:not(.open) .spine-title {
        font-size: 0.85rem;
        white-space: normal;
      }

      .panel:not(.open) .spine-dot {
        margin-left: auto;
        flex-shrink: 0;
      }

      .panel.open .c-header {
        cursor: pointer;
      }

      /* Stack the clip + skills vertically on narrow screens. */
      .c-media-row {
        flex-direction: column;
      }

      footer {
        padding: 1.5rem;
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }

      /* Keep LinkedIn + email on the first line, push the phone number below. */
      .footer-links {
        flex-wrap: wrap;
        gap: 0.6rem 1.5rem;
      }

      .footer-links a[href^="tel:"] {
        flex-basis: 100%;
      }
    }
  </style>
</head>

            </svg>
          </span>
        </div>
      </div>
      <div class="header-left">
        <div class="header-name">
          <div class="eyebrow">Portfolio // 2022–2026</div>
          <h1>Aleksandra<br>Pavlova-Verevkina</h1>
          <div class="header-role">Creative PM · Producer · GameDev</div>
        </div>
        <nav>
          <a href="https://www.linkedin.com/in/aleksandra-pavlova-verevkina/" target="_blank"
            rel="noopener" aria-label="LinkedIn" title="LinkedIn">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z" />

  </header>

  <div class="filter-bar">
    <button class="filter-btn active" data-filter="games">Projects</button>
    <button class="filter-btn" data-filter="tech">Projects</button>
    <button class="filter-btn filter-btn--milestones" data-filter="achievements">Milestones</button>
  </div>

  <div class="hero">
    <div id="hero-content">
      <p class="bio" id="hero-bio"></p>
    </div>

    <div class="hero-milestones-full" id="hero-milestones-full" hidden>
      <div class="strip-wrap">

    function frameMediaHTML(m) {

      const icon = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="14" rx="1"/><path d="M8 21h8M12 17v4"/></svg>`;

      } else if (m.canva) {
        const decks = Array.isArray(m.canva) ? m.canva : [m.canva];
        btn = `<button class="c-img-deck" onclick='openModalDecks(${JSON.stringify(decks)})'>${icon} View Presentation</button>`;
      }
      return `<div class="frame-media"><img class="frame-shot" src="${m.image}" alt="" loading="lazy" draggable="false">${btn}</div>`;
    }

    function buildMilestonesView() {
      const el = document.getElementById('strip');
      if (!el) return;

      el.innerHTML = MILESTONES.map(m => {
        const bits = m.date.split(' ');
        return `
        <article class="frame">
          <div class="frame-top">
            <div>
              <div class="frame-year">${bits[bits.length - 1]}</div>
              <div class="ms-label">${bits.length > 1 ? bits[0] : 'across the year'}</div>
            </div>
            ${m.seal ? `<img class="frame-seal" src="${m.seal}" alt="" loading="lazy" draggable="false">` : ''}
          </div>
          <h4>${m.title}</h4>
          <p>${m.body}</p>
          ${frameMediaHTML(m)}
        </article>`;
      }).join('');

      // Mouse drag to scroll; touch keeps native momentum scrolling.
      let down = false, startX = 0, startLeft = 0, moved = 0;
      el.addEventListener('pointerdown', e => {
        if (e.pointerType === 'touch') return;
        down = true;
        moved = 0;
        startX = e.clientX;
        startLeft = el.scrollLeft;
        el.classList.add('dragging');
      });
      el.addEventListener('pointermove', e => {
        if (!down) return;
        const d = e.clientX - startX;
        moved = Math.max(moved, Math.abs(d));
        el.scrollLeft = startLeft - d;
      });
      // A drag that ends on a button shouldn't open it.
      el.addEventListener('click', e => {
        if (moved > 5) { e.stopPropagation(); e.preventDefault(); }
      }, true);
      const up = () => {
        if (!down) return;
        down = false;
        el.classList.remove('dragging');
      };
      el.addEventListener('pointerup', up);
      el.addEventListener('pointerleave', up);
    }

    // ── HELPERS ──────────────────────────────────────────────────

    function getParam() {
      const v = new URLSearchParams(location.search).get('view');
      return ['games', 'tech', 'achievements'].includes(v) ? v : getHome();
    }

    // The role view (games / tech) a visitor arrived on. Visitors can only
    // switch between it and Milestones; the other role view is reachable
    // only by editing the URL. While on Milestones, `role` keeps the home view.
    function getHome() {
      const params = new URLSearchParams(location.search);
      const v = params.get('view');
      if (v === 'games' || v === 'tech') return v;
      return params.get('role') === 'tech' ? 'tech' : 'games';
    }

    function pushParam(f) {
      const u = new URL(location.href);
      u.searchParams.set('view', f);
      if (f === 'achievements' && HOME === 'tech') u.searchParams.set('role', 'tech');
      else u.searchParams.delete('role');
      history.pushState({}, '', u);
    }

    function resolveKey(f) {
      if (f === 'tech') return 'tech';
      return 'games';
    }

    function renderSkillTag(skill) {
      const type = SOFT_SKILLS.has(skill) ? 'soft' : 'hard';
      return `<span class="skill-tag ${type}">${skill}</span>`;
    }

    // ── SKILLS TICKER ────────────────────────────────────────────
    // Every skill from the header lists and projects, deduplicated
    // (case-insensitive), scrolling like TV captions. The group is
    // rendered twice so the -50% loop is seamless.
    const SKILL_ALIASES = { 'Stakeholder Comm.': 'Stakeholder Communication', 'LEAN': 'Lean' };
    const TICKER_SPEED = 40; // scroll speed in pixels per second

    function buildSkillsTicker() {
      const track = document.querySelector('.js-skills-track');
      if (!track) return;
      const seen = new Map();
      [
        ...Object.values(HEADER_SKILLS).flat(),
        ...PROJECTS.flatMap(p => p.skills || []),
        ...SOFT_SKILLS_LIST
      ].forEach(raw => {
        const s = SKILL_ALIASES[raw] || raw;
        const k = s.toLowerCase();
        if (!seen.has(k)) seen.set(k, s);
      });
      const group = [...seen.values()].map(renderSkillTag).join('');
      track.innerHTML = `<div class="skills-group">${group}</div>` +
        `<div class="skills-group" aria-hidden="true">${group}</div>`;

      // Duration = one group's width / speed, so the speed stays the same
      // however many skills there are. Re-measured once fonts load.
      // On mobile the line runs vertically, so measure height there instead.
      const mobile = window.matchMedia('(max-width: 767px)');
      const setDuration = () => {
        const g = track.firstElementChild;
        const len = mobile.matches ? g.offsetHeight : g.offsetWidth;
        if (len) track.style.animationDuration = (len / TICKER_SPEED) + 's';
      };
      setDuration();
      document.fonts?.ready.then(setDuration);
      mobile.addEventListener('change', setDuration);
    }

    function renderPdf(url) {
      const wrap = document.getElementById('canva-frame-wrap');
      const scroll = document.getElementById('pdf-scroll');

          pdf.getPage(n).then(page => {
            const vp = page.getViewport({ scale: 2 });
            canvas.width = vp.width;
            canvas.height = vp.height;
            page.render({ canvasContext: canvas.getContext('2d'), viewport: vp });
          });
        }
      }).catch(() => {
        scroll.innerHTML = '<p class="pdf-msg">Could not load PDF.</p>';
      });
    }

    function showCanvaDeck(n) {
      canvaIdx = (n + canvaDecks.length) % canvaDecks.length;
      const url = canvaDecks[canvaIdx];
      if (/\.pdf($|\?|#)/i.test(url)) {
        renderPdf(url);
      } else {
        document.getElementById('pdf-scroll').style.display = 'none';
        const wrap = document.getElementById('canva-frame-wrap');
        wrap.style.display = 'block';
        document.getElementById('canva-frame').src = url;
      }
      document.querySelectorAll('.canva-dot').forEach((d, i) =>
        d.classList.toggle('active', i === canvaIdx)
      );
    }

    function cycleCanva(n, restart) {
      showCanvaDeck(canvaIdx + n);
      if (restart) startCanvaAuto();
    }

    function startCanvaAuto() {
      clearInterval(canvaTimer);
      if (canvaDecks.length > 1) {
        canvaTimer = setInterval(() => showCanvaDeck(canvaIdx + 1), 12000);
      }
    }

    function openModalDecks(decks) {
      canvaDecks = decks;
      canvaIdx = 0;
      const modal = document.getElementById('canva-modal');
      const dots = modal.querySelector('.canva-dots');
      dots.innerHTML = canvaDecks.map((_, i) =>
        `<button class="canva-dot" onclick="cycleCanva(${i} - canvaIdx, true)" aria-label="Deck ${i + 1}"></button>`
      ).join('');
      modal.querySelector('.canva-nav').style.display = canvaDecks.length > 1 ? '' : 'none';
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
      showCanvaDeck(0);
      startCanvaAuto();
    }

    function openCanva(e, projIdx) {
      e.stopPropagation();
      const proj = PROJECTS[projIdx];
      openModalDecks(proj.canva || [proj.pdf]);
    }

    function closeCanva() {
      clearInterval(canvaTimer);
      const modal = document.getElementById('canva-modal');
      modal.classList.remove('open');
      document.getElementById('canva-frame').src = 'about:blank';
      document.getElementById('pdf-scroll').innerHTML = '';
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const m = document.getElementById('canva-modal');
        if (m && m.classList.contains('open')) closeCanva();
      }
    });

    function openPanel(idx) {
      document.querySelectorAll('.panel').forEach((p, i) =>
        p.classList.toggle('open', i === idx)
      );
      const clip = document.getElementById('photo-clip');
      if (clip) {
        clip.classList.remove('swaying');
        void clip.offsetWidth;
        clip.classList.add('swaying');
      }
    }

    // ── APPLY FILTER ─────────────────────────────────────────────

    function applyFilter(f, push = true) {
      document.querySelectorAll('.filter-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.filter === f)
      );

      const heroContent = document.getElementById('hero-content');
      const heroMilestones = document.getElementById('hero-milestones-full');
      const wipClip = document.getElementById('wip-clip');

      const heroEl = document.querySelector('.hero');
      const secLabel = document.getElementById('sec-label');
      const archiveWrap = document.querySelector('.accordion-wrap');
      if (f === 'achievements') {
        if (heroContent) heroContent.hidden = true;
        if (heroMilestones) heroMilestones.hidden = false;
        if (wipClip) wipClip.hidden = true;
        heroEl?.classList.add('hero--milestones');
        // Achievements view stands on its own — hide the project archive below.
        if (secLabel) secLabel.hidden = true;
        if (archiveWrap) archiveWrap.hidden = true;
      } else {
        if (heroContent) heroContent.hidden = false;
        if (heroMilestones) heroMilestones.hidden = true;
        if (wipClip) wipClip.hidden = false;
        heroEl?.classList.remove('hero--milestones');
        if (secLabel) secLabel.hidden = false;
        if (archiveWrap) archiveWrap.hidden = false;

        document.getElementById('hero-bio').innerHTML = HERO[f] || HERO.all;

        const key = resolveKey(f);
        let visibleCount = 0;
        let firstVisible = -1;
        PROJECTS.forEach((p, i) => {
          const panel = document.getElementById('p' + i);
          if (!panel) return;
          const hide = Array.isArray(p.hideIn) && p.hideIn.includes(f);
          panel.hidden = hide;
          if (hide) return;
          if (firstVisible === -1) firstVisible = i;
          visibleCount++;
          panel.querySelector('.js-role').textContent = p.roles[key];
          panel.querySelector('.js-bullets').innerHTML =
            p.bullets[key].map(b => b && b.lesson
              ? `<li class="c-lesson"><span class="c-lesson-tag">Postmortem</span>${b.lesson}</li>`
              : `<li>${b}</li>`).join('');
        });

        if (secLabel) secLabel.textContent = `Archive Log // ${visibleCount} Projects`;

        // If the currently open panel was hidden in this view, open the first visible one.
        const openEl = document.querySelector('.panel.open');
        if ((!openEl || openEl.hidden) && firstVisible !== -1 && !MOBILE.matches) openPanel(firstVisible);
      }

      if (push) pushParam(f);
    }

    // ── INIT ─────────────────────────────────────────────────────

    const HOME = getHome();
    document.querySelectorAll('.filter-btn').forEach(b => {
      const f = b.dataset.filter;
      if ((f === 'games' || f === 'tech') && f !== HOME) b.remove();
    });

    // Fills the WIP note from the WIP object. The media slot shows a clip, a
    // still, or an empty frame, in that order of preference.
    function buildWIP() {
      const set = (id, text) => {
        const el = document.getElementById(id);
        if (el) el.textContent = text || '';
      };
      set('wip-eyebrow', WIP.eyebrow);
      set('wip-title', WIP.title);
      const statusEl = document.getElementById('wip-status');
      if (statusEl) statusEl.innerHTML = WIP.blurb || '';

      const fillMedia = (id, src) => {
        const el = document.getElementById(id);
        if (!el) return;
        const { clip, image } = src || {};
        if (clip) {
          el.classList.remove('wip-media--empty');
          el.innerHTML = `<video src="${clip}" autoplay muted loop playsinline></video>`;
        } else if (image) {
          el.classList.remove('wip-media--empty');
          el.innerHTML = `<img src="${image}" alt="">`;
        } else {
          el.classList.add('wip-media--empty');
          el.innerHTML =
            '<span style="font-size:1.5rem;line-height:1">▶</span><span>footage coming</span>';
        }
      };
      fillMedia('wip-media', (WIP.media || [])[0]);
      fillMedia('wip-media-2', (WIP.media || [])[1]);

      const tags = document.getElementById('wip-tags');
      if (tags) {
        tags.innerHTML = (WIP.tags || [])
          .map(t => `<span class="skill-tag">${t}</span>`).join('');
      }
    }

    buildAccordion();
    buildMilestonesView();
    buildSkillsTicker();
    buildWIP();
    applyFilter(getParam(), false);

    document.querySelectorAll('.filter-btn').forEach(b =>
      b.addEventListener('click', () => applyFilter(b.dataset.filter))
    );

    window.addEventListener('popstate', () => applyFilter(getParam(), false));

    // ── PHOTO FOCUS MODE ─────────────────────────────────────────
    // Click the photo to flip it to the note, float it to the centre of the
    // screen, and dim the rest of the site. Click again / backdrop / Esc closes.
    (function () {
      const clip = document.getElementById('photo-clip');
      const btn = document.getElementById('photo-flip');
      const backdrop = document.getElementById('focus-backdrop');
      if (!clip || !btn || !backdrop) return;

      let open = false;

      // Transform that flies the resting card to the viewport centre and scales
      // it up. Measured against the *untransformed* layout box so the maths is
      // independent of the card's resting tilt; keeps transform-origin at the
      // CSS default (top center) so the open/close tween stays smooth.
      function centerTransform() {
        const prev = clip.style.transform;
        const prevTrans = clip.style.transition;
        clip.style.transition = 'none';
        clip.style.transform = 'none';
        const r = clip.getBoundingClientRect();
        clip.style.transform = prev;
        clip.style.transition = prevTrans;
        const scale = Math.min(
          2.0,
          (window.innerHeight * 0.82) / r.height,
          (window.innerWidth * 0.92) / r.width
        );
        const dx = window.innerWidth / 2 - (r.left + r.width / 2);
        const dy = window.innerHeight / 2 - r.top - scale * r.height / 2;
        return `translate(${dx}px, ${dy}px) scale(${scale})`;
      }

      function openFocus() {
        if (open) return;
        open = true;
        clip.classList.add('hint-dismissed');   // retire the cue after first use
        clip.classList.remove('swaying');
        const target = centerTransform();
        requestAnimationFrame(() => {
          clip.style.transition = 'transform .5s cubic-bezier(.4,0,.2,1)';
          clip.classList.add('focus-active');   // flips the card
          clip.style.transform = target;
          backdrop.classList.add('show');
          btn.setAttribute('aria-pressed', 'true');
        });
      }

      function closeFocus() {
        if (!open) return;
        open = false;
        clip.classList.remove('focus-active');   // flips back
        clip.style.transform = '';               // eases home to the resting tilt
        backdrop.classList.remove('show');
        btn.setAttribute('aria-pressed', 'false');
        setTimeout(() => { if (!open) clip.style.transition = ''; }, 520);
      }

      btn.addEventListener('click', (e) => {
        e.preventDefault();
        open ? closeFocus() : openFocus();
      });
      backdrop.addEventListener('click', closeFocus);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeFocus();
      });
      window.addEventListener('resize', () => {
        if (open) clip.style.transform = centerTransform();
      });
    })();

  </script>
</body>
