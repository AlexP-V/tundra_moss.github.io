<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aleksandra Pavlova-Verevkina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Londrina+Shadow&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #f2ece0;
      --grid: rgba(0, 0, 0, 0.055);
      --grid-sz: 22px;
      --ink: #1a1814;
      --ink-2: #5c5850;
      --ink-3: #9e9890;
      --border: #d0cac0;
      --surface: #faf7f0;
      --mustard: #c4953a;
      --soft-bg: #f1e3cf;
      --soft-bd: #d7c2a5;
      --soft-ink: #8a6a43;
      --hard-bg: #e4ebf0;
      --hard-bd: #b7c6d4;
      --hard-ink: #475b6e;
    }

    html {
      font-size: 110%;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background-color: var(--bg);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: var(--grid-sz) var(--grid-sz);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      padding: 2.25rem 3rem 1.5rem;
    }

    .header-cols {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4rem;
      align-items: center;
    }

    .header-center {
      display: flex;
      justify-content: flex-start;
      padding-top: 0.5rem;
    }

    .eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-family: 'Londrina Shadow', 'Space Grotesk', sans-serif;
      font-size: clamp(3rem, 7.2vw, 8.5rem);
      font-weight: 400;
      letter-spacing: 0.01em;
      line-height: 0.95;
    }

    .header-role {
      font-family: 'Space Mono', monospace;
      font-size: clamp(0.95rem, 1.9vw, 1.7rem);
      letter-spacing: 0.06em;
      color: var(--ink);
      margin-top: 1rem;
      display: inline-block;
      background: linear-gradient(103deg,
          transparent 1.8%,
          rgba(255, 228, 25, 0.497) 2.4%,
          rgba(255, 224, 15, 0.72) 38%,
          rgba(255, 231, 28, 0.83) 63%,
          rgba(255, 223, 18, 0.354) 96.5%,
          transparent 97.5%);
      padding: 0.08em 0.22em 0.06em;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }

    /* Name block on the left, contact icons in the free space to its right */
    .header-left {
      display: flex;
      align-items: center;
      gap: 3rem;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    nav a {
      display: flex;
      color: var(--mustard);
      transition: color .18s, transform .18s;
    }

    nav a svg {
      width: clamp(4rem, 6.4vw, 6rem);
      height: clamp(4rem, 6.4vw, 6rem);
    }

    /* Playful tilt — each icon leans a different way */
    nav a:nth-child(1) {
      transform: rotate(-8deg);
    }

    nav a:nth-child(2) {
      transform: rotate(6deg);
    }

    nav a:hover,
    nav a:focus-visible {
      color: var(--ink);
      transform: rotate(0deg) scale(1.08);
    }

    /* ── FILTER BAR ── */
    .filter-bar {
      padding: 0 3rem;
      display: flex;
      border-bottom: 1px solid var(--border);
    }

    .filter-btn {
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 0.65rem 1.4rem 0.55rem;
      cursor: pointer;
      margin-bottom: -1px;
      transition: color .18s;
    }

    .filter-btn:hover {
      color: var(--mustard);
    }

    .filter-btn.active {
      color: var(--mustard);
      border-bottom-color: var(--mustard);
    }

    /* ── PHOTO CLIP ── */
    .photo-clip {
      position: relative;
      width: 224px;
      transform: rotate(-2.5deg) translateX(8px);
      transform-origin: top center;
      filter: drop-shadow(3px 6px 14px rgba(0, 0, 0, 0.14));
      perspective: 900px;
      z-index: 1;
    }

    /* While focus mode is active the clip is lifted above the dim backdrop
       (its centring transform is driven inline from JS). */
    .photo-clip.focus-active {
      z-index: 1000;
    }

    /* ── CLICK HINT ── cursor-click icon tucked at the photo's corner */
    .photo-hint {
      position: absolute;
      right: -30px;
      bottom: -26px;
      z-index: 3;
      pointer-events: none;
      color: var(--mustard);
      transform-origin: top left;
      animation: hint-bob 1.7s ease-in-out infinite;
      transition: opacity .35s;
    }

    .photo-hint-icon {
      display: block;
      filter: drop-shadow(1px 2px 3px rgba(0, 0, 0, 0.18));
    }

    @keyframes hint-bob {

      0%,
      100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(-4px, -4px);
      }
    }

    /* Hide the cue while the note is open, and for good once it's been used. */
    .photo-clip.focus-active .photo-hint,
    .photo-clip.hint-dismissed .photo-hint {
      opacity: 0;
    }

    .photo-clip.hint-dismissed .photo-hint {
      pointer-events: none;
      animation: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .photo-hint {
        animation: none;
      }
    }

    .photo-flip {
      all: unset;
      display: block;
      width: 100%;
      cursor: pointer;
    }

    .photo-flip:focus-visible {
      outline: 2px solid var(--mustard);
      outline-offset: 4px;
    }

    .photo-card {
      position: relative;
      width: 100%;
      display: block;
      transform-style: preserve-3d;
      transition: transform .55s cubic-bezier(.4, 0, .2, 1);
    }

    /* Card flips to the note only in focus mode (click to open). A subtle
       hover cue hints it's interactive without committing the flip. */
    .photo-clip:not(.focus-active):hover .photo-card {
      transform: translateY(-3px);
    }

    .photo-clip.focus-active .photo-card {
      transform: rotateY(180deg);
    }

    /* ── FOCUS BACKDROP ── dims the rest of the site while the note is open */
    .focus-backdrop {
      position: fixed;
      inset: 0;
      z-index: 900;
      background: rgba(20, 16, 12, 0.62);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .45s ease;
    }

    .focus-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    .photo-face {
      width: 100%;
      height: 100%;
      display: block;
      backface-visibility: hidden;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: #fff;
    }

    .photo-front {
      position: relative;
      z-index: 1;
    }

    .photo-back {
      position: absolute;
      inset: 0;
      transform: rotateY(180deg);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.7rem;
      overflow: hidden;
    }

    .note {
      width: 100%;
      height: 100%;
      border: none;
      padding: 0.6rem;
      background: repeating-linear-gradient(0deg,
          rgba(0, 0, 0, 0.04) 0,
          rgba(0, 0, 0, 0.04) 1px,
          transparent 1px,
          transparent 14px);
      font-family: 'Caveat', 'Space Mono', monospace;
      color: var(--ink-2);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      overflow: hidden;
    }

    .note-title {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .note-text {
      font-size: 0.82rem;
      line-height: 1.2;
    }

    .note-sign {
      margin-top: auto;
      font-size: 0.85rem;
      text-align: right;
    }

    .photo-clip img {
      width: 100%;
      height: auto;
      display: block;
    }

    .paperclip {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      pointer-events: none;
    }

    @keyframes sway {
      0% {
        transform: rotate(-2.5deg) translateX(8px);
      }

      18% {
        transform: rotate(4.5deg) translateX(8px);
      }

      36% {
        transform: rotate(-5.5deg) translateX(8px);
      }

      54% {
        transform: rotate(3deg) translateX(8px);
      }

      72% {
        transform: rotate(-3.5deg) translateX(8px);
      }

      88% {
        transform: rotate(-2deg) translateX(8px);
      }

      100% {
        transform: rotate(-2.5deg) translateX(8px);
      }
    }

    .photo-clip.swaying {
      animation: sway 0.9s cubic-bezier(.4, 0, .2, 1);
    }

    /* ── HERO ── */
    .hero {
      padding: 2rem 3rem 1.5rem;
    }

    .bio {
      font-size: 0.88rem;
      line-height: 1.65;
      color: var(--ink-2);
    }

    /* ── IN PROGRESS ── laid out like About Me: footage stacked on the left
       as taped shots; on the right a torn notebook card with the title and
       blurb, and a taped card of tags. */
    .wip-clip {
      padding: 2rem 3rem 3rem;
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
      gap: 2.4rem 3rem;
      align-items: start;
    }

    /* An author `display` beats the UA rule for [hidden], so restate it;
       only the In Progress tab shows this block. */
    .wip-clip[hidden] {
      display: none;
    }

    /* Stays in view while the footage column scrolls past. */
    .wip-side {
      position: sticky;
      top: 1.6rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* Text card: same torn, ruled notebook page as the About Me offers. */
    .wip-card {
      position: relative;
      background-color: var(--surface);
      background-image: repeating-linear-gradient(0deg,
          rgba(0, 0, 0, 0.04) 0,
          rgba(0, 0, 0, 0.04) 1px,
          transparent 1px,
          transparent 28px);
      padding: 2.2rem 1.6rem 1.6rem;
    }

    .wip-status {
      font-size: 0.95rem;
      line-height: 1.75;
      color: var(--ink-2);
    }

    .wip-head {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      margin-bottom: 0.9rem;
    }

    .wip-head .about-head {
      font-size: 2.6rem;
      margin: 0;
    }

    /* Same treatment as the footer links. */
    .wip-status a {
      color: var(--mustard);
      text-decoration: none;
      transition: color .15s;
    }

    .wip-status a:hover {
      color: var(--ink);
    }

    .wip-shots {
      display: flex;
      flex-direction: column;
      gap: 2.4rem;
    }

    /* Each shot is its own taped print. */
    .wip-shot {
      position: relative;
      margin: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.7rem;
      filter: drop-shadow(0 1px 2px rgba(26, 24, 20, .16));
    }

    .wip-shot::before {
      content: '';
      position: absolute;
      top: -10px;
      left: calc(50% - 40px);
      width: 80px;
      height: 20px;
      background: rgba(196, 149, 58, .3);
      border-left: 2px dotted rgba(255, 255, 255, .5);
      border-right: 2px dotted rgba(255, 255, 255, .5);
      transform: rotate(-2.5deg);
      z-index: 1;
    }

    .wip-shot:nth-child(even)::before {
      transform: rotate(2deg);
    }

    .wip-shot img,
    .wip-shot video {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid var(--border);
    }

    .wip-shot--empty {
      aspect-ratio: 16 / 9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: var(--ink-3);
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* ── SECTION LABEL ── */
    /* ── ACCORDION ── */
    .accordion-wrap {
      padding: 1rem 3rem 1.4rem;
    }

    /* Project folders laid in a straight row, overlapping: the first file
       lies on top at the left, each next one tucks behind it a step to the
       right so its coloured side tab shows. Hover nudges a folder up;
       clicking opens its project page (#/project/CODE). Positions and size
       are set by layoutFan(). */
    .accordion {
      --s: 1;
      position: relative;
      height: 600px;
      margin-top: 1rem;
    }

    .folder {
      --lift: 0px;
      --dy: 0px;
      --r: 0deg;
      position: absolute;
      left: calc(50% - 165px);
      top: 60px;
      width: 330px;
      height: 440px;
      display: block;
      color: var(--ink);
      text-decoration: none;
      transform-origin: 0 0;
      /* scale from the top-left (layout maths), then tilt around the
         folder's own centre and apply the jitter + hover nudge */
      transform: scale(var(--s)) translateY(calc(var(--dy) + var(--lift))) translate(165px, 220px) rotate(var(--r)) translate(-165px, -220px);
      transition: transform .3s cubic-bezier(.3, .7, .3, 1), filter .25s;
      filter: drop-shadow(0 6px 10px rgba(26, 24, 20, .22));
    }

    /* Folders under the top one are black and white so they don't compete
       with it; hovering one brings it back to full colour. */
    .folder:not(.is-top) {
      filter: grayscale(1);
    }

    .folder[hidden] {
      display: none;
    }

    /* Hover nudges a folder up out of the hand; it keeps its place in the stack. */
    .folder:hover,
    .folder:focus-visible {
      --lift: -22px;
      outline: none;
    }

    /* A hovered folder from under the stack gets its colour back, but no
       shadow; the top folder keeps the shadow it already has. */
    .folder:not(.is-top):hover,
    .folder:not(.is-top):focus-visible {
      filter: none;
    }

    .folder:focus-visible .folder-body {
      box-shadow: inset 0 0 0 2px var(--mustard);
    }

    /* kraft board */
    .folder-body {
      position: absolute;
      inset: 0 26px 0 0;
      border-radius: 3px 6px 6px 3px;
      background-color: #c79f6e;
      background-image:
        radial-gradient(ellipse at 30% 20%, rgba(255, 240, 210, .28), transparent 60%),
        radial-gradient(ellipse at 80% 90%, rgba(90, 55, 20, .18), transparent 55%),
        repeating-linear-gradient(97deg, rgba(0, 0, 0, .018) 0 2px, transparent 2px 5px);
      box-shadow: inset 0 0 0 1px rgba(90, 60, 25, .25);
    }

    /* side tab in the project's colour */
    .folder-tab {
      position: absolute;
      right: 0;
      top: 24px;
      width: 30px;
      height: 230px;
      border-radius: 0 6px 6px 0;
      background: #c79f6e;
      box-shadow: inset 0 0 0 1px rgba(90, 60, 25, .25);
      padding: 6px 5px 6px 0;
    }

    .folder-tab span {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      border-radius: 0 3px 3px 0;
      background: var(--c);
      writing-mode: vertical-rl;
      font-family: 'Space Mono', monospace;
      font-size: 0.5rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .92);
      white-space: nowrap;
      overflow: hidden;
    }

    .folder--featured .folder-tab span {
      background: #fff;
      color: #2f4a6e;
      box-shadow: inset 0 0 0 1.5px #2f4a6e;
    }

    .folder-clip {
      display: none;
      position: absolute;
      top: -16px;
      left: 54px;
      width: 58px;
      height: 34px;
    }

    .folder.is-top .folder-clip {
      display: block;
    }

    .folder-label {
      position: absolute;
      top: 54px;
      left: 34px;
      right: 34px;
      background: #f6f0e2;
      border-radius: 4px;
      padding: 0.75rem 0.85rem 0.6rem;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .15);
      border-top: 4px solid var(--c);
      text-align: center;
    }

    .folder-kicker {
      font-family: 'Space Mono', monospace;
      font-size: 0.48rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-2);
    }

    .folder-sub {
      font-family: 'Space Mono', monospace;
      font-style: italic;
      font-size: 0.5rem;
      color: var(--ink-3);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 0.25rem 0;
      margin: 0.45rem 0 0.5rem;
    }

    .folder-title {
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.12;
      text-transform: uppercase;
    }

    .folder-meta {
      display: flex;
      justify-content: space-between;
      gap: 0.6rem;
      margin-top: 0.6rem;
      padding-top: 0.35rem;
      border-top: 1px solid var(--border);
      font-family: 'Space Mono', monospace;
      font-size: 0.46rem;
      letter-spacing: 0.06em;
      color: var(--ink-2);
      text-align: left;
    }

    .folder-meta b {
      font-weight: 700;
      letter-spacing: 0.12em;
      margin-right: 0.3em;
    }

    .folder-stamp {
      position: absolute;
      left: 34px;
      right: 34px;
      bottom: 64px;
      background: #b8483a;
      padding: 5px;
      text-align: center;
    }

    .folder-stamp div {
      background: #241f1a;
      color: #e8b4a8;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 0.82rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      padding: 0.3rem 0;
    }

    .folder-stamp small {
      display: block;
      font-family: 'Space Mono', monospace;
      font-style: italic;
      font-size: 0.5rem;
      color: #241f1a;
      padding-top: 3px;
    }

    .c-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1.2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .c-code {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 0.3rem;
    }

    .c-title {
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .c-role {
      font-family: 'Space Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.06em;
      color: var(--ink-2);
      margin-top: 0.4rem;
    }

    .c-right {
      text-align: right;
      flex-shrink: 0;
    }

    .c-date {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.06em;
      color: var(--ink-3);
      white-space: nowrap;
    }

    .c-status {
      font-family: 'Space Mono', monospace;
      font-size: 0.5rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-top: 0.25rem;
      opacity: 0.65;
    }

    .c-img {
      width: 100%;
      height: 128px;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .c-img-video {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .c-img-play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.7);
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding-left: 3px;
      transition: background 0.2s, transform 0.2s;
    }

    .c-img-play:hover {
      background: rgba(0, 0, 0, 0.78);
      transform: translate(-50%, -50%) scale(1.08);
    }

    .c-img-deck {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 0.9rem;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: background 0.2s, transform 0.2s;
    }

    .c-img-deck:hover {
      background: rgba(0, 0, 0, 0.78);
      transform: translate(-50%, -50%) scale(1.05);
    }

    .canva-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(10, 8, 6, 0.88);
      backdrop-filter: blur(4px);
      padding: 2.5rem 1.5rem;
    }

    .canva-modal.open {
      display: flex;
    }

    .canva-box {
      width: min(1000px, 100%);
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      position: relative;
    }

    .canva-close {
      position: absolute;
      top: -2rem;
      right: 0;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.8rem;
      line-height: 1;
      cursor: pointer;
      opacity: 0.8;
    }

    .canva-close:hover {
      opacity: 1;
    }

    .canva-frame-wrap {
      position: relative;
      width: 100%;
      padding-top: 62.5%;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .canva-frame-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .pdf-scroll {
      display: none;
      max-height: 82vh;
      overflow-y: auto;
      border-radius: 6px;
      background: #1c1814;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      padding: 0.6rem;
    }

    .pdf-page {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 2px;
    }

    .pdf-page+.pdf-page {
      margin-top: 0.6rem;
    }

    .pdf-msg {
      color: #cbb89c;
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      text-align: center;
      padding: 2rem;
    }

    .canva-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    .canva-arrow {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      transition: background 0.2s;
    }

    .canva-arrow:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .canva-dots {
      display: flex;
      gap: 0.5rem;
    }

    .canva-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: transparent;
      padding: 0;
      cursor: pointer;
      transition: background 0.2s;
    }

    .canva-dot.active {
      background: #fff;
    }

    .c-img-photo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .c-img-cover {
      object-fit: cover;
    }

    .c-title-link {
      color: inherit;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.15em;
    }

    .c-title-link:hover {
      color: var(--mustard);
    }

    .c-clip {
      display: block;
      width: auto;
      max-width: 100%;
      height: auto;
      max-height: 40vh;
      /* cap portrait clips at 40% of viewport height */
      margin: 0 auto 1rem;
      /* centre the (often narrow) portrait video */
      border-radius: 2px;
      background: #000;
    }

    .c-img-lbl {
      font-family: 'Space Mono', monospace;
      font-size: 0.52rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .c-org {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 0.85rem;
    }

    /* Postmortem: a note taped into the project page (paper card, slight
       tilt, strip of mustard tape on top), set in the regular body font. */
    .pj-pm {
      position: relative;
      margin-top: 2.4rem;
      padding: 1.3rem 1.5rem 1.2rem;
      background: #fdf8e6;
      border: 1px solid var(--soft-bd);
      transform: rotate(-0.7deg);
      box-shadow: 2px 5px 14px rgba(26, 24, 20, .1);
    }

    .pj-pm p {
      font-size: 0.92rem;
      line-height: 1.7;
      color: var(--ink-2);
    }

    .pj-pm::before {
      content: '';
      position: absolute;
      top: -0.7rem;
      left: 50%;
      width: 6rem;
      height: 1.5rem;
      margin-left: -3rem;
      background: rgba(196, 149, 58, .22);
      border-left: 1px dashed rgba(0, 0, 0, .08);
      border-right: 1px dashed rgba(0, 0, 0, .08);
      transform: rotate(-1.6deg);
    }

    .c-lesson-tag {
      display: block;
      margin-bottom: 0.6rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #a8412f;
    }

    /* ── PROJECT PAGE ── full page per project (#/project/CODE), laid out
       like the archive's dossier: info rail left, reading column right. */
    .pj-view {
      padding: 0 3rem 3rem;
    }

    body.pj-open> :not(.pj-view):not(footer):not(script):not(.canva-modal) {
      display: none !important;
    }

    /* Back link styled as a folder's side tab (kraft edge, strip in the
       project's colour), hooked onto the card's right edge. Sticky, so it
       stays in reach on long pages. */
    .pj-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      margin-top: 2rem;
    }

    .pj-side {
      position: sticky;
      top: 1.4rem;
      margin-top: 24px;
      margin-left: -1px;
    }

    .pj-back {
      display: block;
      width: 30px;
      height: 230px;
      border-radius: 0 6px 6px 0;
      background: #c79f6e;
      box-shadow: inset 0 0 0 1px rgba(90, 60, 25, .25), 0 6px 10px rgba(26, 24, 20, .14);
      padding: 6px 5px 6px 0;
      text-decoration: none;
    }

    .pj-back span {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      border-radius: 0 3px 3px 0;
      background: var(--c, var(--mustard));
      writing-mode: vertical-rl;
      font-family: 'Space Mono', monospace;
      font-size: 0.5rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .92);
      white-space: nowrap;
      transition: background-color .16s, color .16s;
    }

    /* Hover turns the strip black, like the View Presentation button. */
    .pj-back:hover span,
    .pj-back:focus-visible span {
      background: var(--ink);
      color: var(--surface);
    }

    .pj-back:focus-visible {
      outline: none;
    }

    .pj {
      display: grid;
      grid-template-columns: 16rem minmax(0, 1fr);
      gap: 0 clamp(2rem, 4.5vw, 4rem);
      border: 1px solid var(--border);
      border-top-width: 4px;
      background: var(--surface);
      box-shadow: 0 10px 28px rgba(26, 24, 20, 0.1);
      padding: clamp(1.6rem, 3vw, 2.6rem);
    }

    .pj-rail {
      position: sticky;
      top: 1.4rem;
      align-self: start;
      border-right: 1px solid var(--border);
      padding-right: clamp(1rem, 2vw, 2rem);
    }

    .pj-code {
      font-family: 'Space Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      color: var(--mustard);
    }

    .pj-title {
      font-family: 'Londrina Shadow', sans-serif;
      font-weight: 400;
      font-size: clamp(1.9rem, 3.6vw, 2.8rem);
      line-height: 0.96;
      letter-spacing: 0.01em;
      margin: 0.5rem 0 0.6rem;
    }

    .pj-title a {
      color: inherit;
      text-decoration: none;
      border-bottom: 2px solid var(--mustard);
    }

    .pj-meta {
      margin-top: 1.4rem;
      border-top: 1px solid var(--border);
    }

    .pj-meta div {
      border-bottom: 1px solid var(--border);
      padding: 0.55rem 0;
    }

    .pj-meta dt {
      font-family: 'Space Mono', monospace;
      font-size: 0.54rem;
      letter-spacing: 0.17em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    .pj-meta dd {
      font-size: 0.86rem;
      line-height: 1.45;
      margin-top: 0.15rem;
    }

    .pj-skills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 1.2rem;
    }

    .pj-skills .skill-tag {
      font-size: 0.58rem;
    }

    .pj-body {
      max-width: 66ch;
    }

    .pj-body>p {
      font-size: 0.95rem;
      line-height: 1.78;
      color: var(--ink-2);
      margin-top: 1.3rem;
    }

    .pj-body>p.pj-lead {
      margin-top: 0;
      font-size: 1.12rem;
      line-height: 1.62;
      color: var(--ink);
    }

    /* The frame hugs its picture or clip, whatever its ratio; only the
       YouTube embed (.pj-plate--wide) spans the column. */
    .pj-plate {
      width: fit-content;
      max-width: 100%;
      margin-top: 2rem;
      border: 1px solid var(--border);
      background: #efe8db;
      padding: 0.55rem;
    }

    .pj-plate img,
    .pj-plate video,
    .pj-plate iframe {
      display: block;
      border: 0;
      margin: 0 auto;
      max-width: 100%;
    }

    .pj-plate img,
    .pj-plate video {
      max-height: 70vh;
      width: auto;
      height: auto;
    }

    .pj-plate--wide {
      width: auto;
    }

    .pj-plate iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
    }

    .pj-plate figcaption {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--ink-3);
      padding: 0.55rem 0.15rem 0.1rem;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
    }

    .pj-docs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 1.6rem;
    }

    .pj-doc-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--ink);
      border: 1px solid var(--ink);
      padding: 0.5rem 0.85rem;
      background: var(--surface);
      cursor: pointer;
      transition: background-color .16s, color .16s;
    }

    .pj-doc-btn:hover {
      background: var(--ink);
      color: var(--surface);
    }

    @media (max-width: 1023px) {
      .pj {
        grid-template-columns: 1fr;
        gap: 1.8rem;
      }

      .pj-rail {
        position: static;
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding-right: 0;
        padding-bottom: 1.4rem;
      }
    }

    .c-skills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    /* Video projects: narrow portrait clip on the left, skills filling the
       void to its right instead of sitting at the bottom of the panel. */
    .c-media-row {
      display: flex;
      align-items: flex-start;
      gap: 1.5rem;
      margin-bottom: 1rem;
    }

    .c-media-row .c-clip {
      flex: 0 0 auto;
      margin: 0;
    }

    .c-media-row .c-skills {
      flex: 1;
      align-content: flex-start;
    }

    .skill-tag {
      font-family: 'Space Mono', monospace;
      font-size: 1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-3);
      /* background: var(--soft-bg); */
      border: 1px solid var(--border);
      padding: 0.28rem 0.7rem;
      transition: color .15s, border-color .15s;
    }

    .skill-tag.soft {
      border-color: var(--soft-bd);
    }

    .skill-tag.hard {
      border-color: var(--hard-bd);
    }

    .skill-tag:hover {
      color: var(--ink);
      border-color: var(--ink-3);
    }

    /* ── FOOTER ── */
    footer {
      padding: 1.5rem 3rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 2rem;
    }

    .footer-name {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    .footer-links {
      display: flex;
      gap: 1.5rem;
    }

    .footer-links a {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.08em;
      color: var(--mustard);
      text-decoration: none;
      transition: color .15s;
    }

    .footer-links a:hover {
      color: var(--ink);
    }

    /* ── ABOUT ME ── bio across the top; below it the toolbox (taped index
       cards) beside a torn notebook page of what I can do for you. */
    .about {
      padding: 2rem 3rem 3rem;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 2.2rem 3rem;
      align-items: start;
    }

    .about[hidden] {
      display: none;
    }

    .about-bio {
      grid-column: 1 / -1;
      max-width: 54rem;
      font-size: 1rem;
      line-height: 1.75;
      color: var(--ink-2);
    }

    .about-head {
      font-family: 'Caveat', cursive;
      font-weight: 600;
      font-size: 2rem;
      line-height: 1;
      color: var(--mustard);
      margin-bottom: 1.2rem;
    }

    .toolbox {
      display: flex;
      flex-direction: column;
      gap: 1.6rem;
    }

    .tool-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1.3rem 1.3rem 1.2rem;
      filter: drop-shadow(0 1px 2px rgba(26, 24, 20, .16));
    }

    /* washi tape holding each card down */
    .tool-card::before {
      content: '';
      position: absolute;
      top: -10px;
      left: 1.2rem;
      width: 72px;
      height: 20px;
      background: rgba(196, 149, 58, .3);
      border-left: 2px dotted rgba(255, 255, 255, .5);
      border-right: 2px dotted rgba(255, 255, 255, .5);
      transform: rotate(-3deg);
    }

    .tool-card:nth-child(even)::before {
      left: auto;
      right: 1.2rem;
      transform: rotate(2.5deg);
    }

    .tool-card h4 {
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 0.8rem;
    }

    .tool-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .tool-tags .skill-tag {
      font-size: 0.62rem;
      padding: 0.24rem 0.55rem;
    }

    .offers-wrap {
      filter: drop-shadow(0 1px 2px rgba(26, 24, 20, .2));
    }

    .offers {
      position: relative;
      list-style: none;
      counter-reset: offer;
      background-color: var(--surface);
      background-image: repeating-linear-gradient(0deg,
          rgba(0, 0, 0, 0.04) 0,
          rgba(0, 0, 0, 0.04) 1px,
          transparent 1px,
          transparent 28px);
      padding: 2.2rem 1.6rem 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 1.3rem;
    }

    .offers li {
      counter-increment: offer;
      display: grid;
      grid-template-columns: 2.2rem minmax(0, 1fr);
      column-gap: 0.4rem;
    }

    .offers li::before {
      content: counter(offer);
      grid-row: span 2;
      font-family: 'Caveat', cursive;
      font-weight: 600;
      font-size: 2rem;
      line-height: 0.9;
      color: var(--ink-3);
    }

    .offers b {
      font-weight: 500;
      font-size: 0.95rem;
      line-height: 1.35;
      color: var(--ink);
    }

    .offers span {
      font-size: 0.85rem;
      line-height: 1.6;
      color: var(--ink-2);
    }

    /* ── MILESTONES ── draggable filmstrip (from Issue 01) */
    .hero-milestones-full {
      --ms-pad: 3rem;
    }

    .ms-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    .strip-wrap {
      margin-top: 0;
      position: relative;
    }

    .strip {
      display: flex;
      gap: 1.1rem;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-padding-left: var(--ms-pad);
      padding: 0.9rem var(--ms-pad) 1.6rem;
      margin: 0 calc(var(--ms-pad) * -1);
      scrollbar-width: thin;
      cursor: grab;
    }

    .strip.dragging {
      cursor: grabbing;
      scroll-snap-type: none;
      user-select: none;
    }

    .frame {
      scroll-snap-align: start;
      flex: 0 0 min(21rem, 78vw);
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 1.1rem 1.2rem 1.3rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    /* ── MILESTONE PAPER ── each card is a page torn out of a spiral
       notebook: the top edge is a row of half-holes where it ripped
       through the wire. */
    .frame {
      position: relative;
      padding-top: 1.6rem;
      border-top: 0;
    }

    /* Torn-out-of-a-spiral-notebook top edge; shared by the milestone
       cards and the About Me offers page. */
    .torn-top {
      -webkit-mask:
        radial-gradient(circle 7px at 50% 0, transparent 6.6px, #000 7.2px) 0 0 / 22px 12px repeat-x,
        linear-gradient(#000, #000) 0 12px / 100% 100% no-repeat;
      mask:
        radial-gradient(circle 7px at 50% 0, transparent 6.6px, #000 7.2px) 0 0 / 22px 12px repeat-x,
        linear-gradient(#000, #000) 0 12px / 100% 100% no-repeat;
    }

    .torn-top::before {
      content: '';
      position: absolute;
      inset: 0 0 auto;
      height: 14px;
      background: linear-gradient(rgba(120, 100, 70, .1), transparent);
      pointer-events: none;
    }

    /* A soft paper shadow on the whole strip, so it follows the torn
       edge too (a card's own shadow would be cut off by the mask). */
    .strip {
      filter: drop-shadow(0 1px 2px rgba(26, 24, 20, .2));
    }

    .frame-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.6rem;
    }

    .frame-year {
      font-family: 'Caveat', cursive;
      font-weight: 600;
      font-size: 2.3rem;
      line-height: 0.9;
      color: var(--ink-3);
    }

    .frame-seal {
      width: 3.1rem;
      height: 3.1rem;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--soft-bd);
      flex-shrink: 0;
    }

    .frame h4 {
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.32;
    }

    .frame p {
      font-size: 0.85rem;
      line-height: 1.62;
      color: var(--ink-2);
    }

    /* Image slot at the foot of a frame; holds the deck/artbook button
       (.c-img-deck) centred over the picture when a milestone has one. */
    .frame-media {
      position: relative;
      margin-top: auto;
    }

    .frame-media .c-img-deck {
      white-space: nowrap;
    }

    .frame-shot {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border: 1px solid var(--border);
      -webkit-user-drag: none;
    }


    .hero--milestones {
      max-width: none;
    }

    /* lavender highlighter — same marker treatment as .header-role */
    .hl {
      color: var(--ink);
      background: linear-gradient(103deg,
          transparent 1.8%,
          rgba(187, 160, 240, 0.244) 2.4%,
          rgba(175, 146, 234, 0.295) 38%,
          rgba(185, 157, 240, 0.355) 63%,
          rgba(179, 150, 236, 0.258) 96.5%,
          transparent 97.5%);
      /* Negative side margins cancel the side padding, so the marker can
         bleed past the words without pushing the next word or punctuation away. */
      padding: 0.06em 0.12em 0.04em;
      margin: 0 -0.12em;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }

    /* ── MILESTONES FILTER BTN ── */
    .filter-btn--milestones {
      color: #7B2340;
      opacity: 0.55;
    }

    .filter-btn--milestones:hover {
      color: #7B2340;
      opacity: 1;
    }

    .filter-btn--milestones.active {
      color: #7B2340;
      opacity: 1;
      border-bottom-color: #7B2340;
    }

    /* ── MOBILE ── */
    @media (max-width: 767px) {

      /* Drop the 110% zoom and clip any stray horizontal overflow so the page
         opens at true device width with no empty gutter on the right. */
      html {
        font-size: 100%;
      }

      html,
      body {
        overflow-x: hidden;
      }

      header {
        padding: 1.5rem 1.5rem 1rem;
      }

      .header-cols {
        grid-template-columns: 1fr;
        gap: 1.25rem;
      }

      .header-center {
        justify-content: flex-start;
        padding-top: 0;
      }

      h1 {
        font-size: 2.6rem;
      }

      .header-role {
        font-size: 0.85rem;
      }

      .header-left {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }

      nav {
        flex-direction: row;
      }

      /* Icons sit straight on phones. */
      nav a:nth-child(1),
      nav a:nth-child(2) {
        transform: none;
      }

      .filter-bar,
      .accordion-wrap {
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }

      .about {
        grid-template-columns: minmax(0, 1fr);
        padding: 1.5rem 1.5rem 2rem;
      }

      .offers {
        padding: 2rem 1.1rem 1.2rem;
      }

        position: static;
        order: -1;
      }

      .wip-head .about-head {
        font-size: 2.1rem;

        font-size: 0.72rem;

      }

        font-size: 0.74rem;
      }

      /* Phones: no room for a fan, so the folders become a plain stack of
         kraft folders, each showing its label; tap to open. */
      .accordion {
        height: auto;
        margin-top: 0.5rem;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* No stack here, so nothing is "underneath": every folder in colour. */
      .folder:not(.is-top) {
        filter: drop-shadow(0 6px 10px rgba(26, 24, 20, .22));
      }

      .folder {
        position: relative;
        left: auto;
        top: auto;
        width: 100%;
        height: auto;
        transform: none !important;
        z-index: auto !important;
      }

      .folder-body {
        right: 0;
      }

      /* The side tab becomes a ribbon bookmark in the project's colour,
         hanging from the folder's top edge. */
      .folder-tab {
        top: 0;
        right: 22px;
        width: 16px;
        height: 42px;
        padding: 0;
        border-radius: 0;
        background: var(--c);
        box-shadow: none;
        clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%);
        z-index: 2;
      }

      .folder-tab span {
        display: none;
      }

      .folder.is-top .folder-clip,
      .folder-stamp {
        display: none;
      }

      .folder-label {
        position: relative;
        top: auto;
        left: auto;
        right: auto;
        margin: 14px 50px 14px 14px;
      }

      .pj-view {
        padding: 0 1.5rem 2rem;
      }

      /* Phones: the first visual comes right after the lead paragraph. */
      .pj-body {
        display: flex;
        flex-direction: column;
      }

      .pj-body > * {
        order: 3;
      }

      .pj-body > .pj-lead {
        order: 1;
      }

      .pj-body > .pj-plate:first-of-type {
        order: 2;
      }

      .pj-shell {

      }

      .pj-side {
        position: static;
        grid-row: 1;

      .pj-back {

      footer {

    function buildMilestonesView() {
      const el = document.getElementById('strip');

        return `
        <article class="frame torn-top">
          <div class="frame-top">
            <div>
              <div class="frame-year">${bits[bits.length - 1]}</div>
              <div class="ms-label">${bits.length > 1 ? bits[0] : 'across the year'}</div>

          <h4>${m.title}</h4>
          <p>${m.body}</p>
          ${frameMediaHTML(m)}
        </article>`;
      }).join('');

      // Mouse drag to scroll; touch keeps native momentum scrolling.
      let down = false, startX = 0, startLeft = 0, moved = 0;
      el.addEventListener('pointerdown', e => {
        if (e.pointerType === 'touch') return;
        down = true;
        moved = 0;
        startX = e.clientX;
        startLeft = el.scrollLeft;
        el.classList.add('dragging');
      });
      el.addEventListener('pointermove', e => {
        if (!down) return;
        const d = e.clientX - startX;
        moved = Math.max(moved, Math.abs(d));
        el.scrollLeft = startLeft - d;
      });
      // A drag that ends on a button shouldn't open it.
      el.addEventListener('click', e => {
        if (moved > 5) { e.stopPropagation(); e.preventDefault(); }
      }, true);
      const up = () => {
        if (!down) return;
        down = false;
        el.classList.remove('dragging');
      };
      el.addEventListener('pointerup', up);
      el.addEventListener('pointerleave', up);
    }

    // Soft skills shown on every tab, after that tab's hard skills.

    // ── HELPERS ──────────────────────────────────────────────────

`;

    // Lay the visible folders in an overlapping row across the section's
    // width: same top, even steps, first folder on top at the left.
    // Folders are 330 x 440 units, scaled by --s.
    const FAN = { w: 330, h: 440, scale: 1.25, minStep: 46, jitterY: 14 };
    // Tilt (deg) and vertical offset (px) per folder. Only the folder on
    // top of the stack uses its entry; the rest sit straight and level.
    const MESS = [
      [-1.4, -6], [1.1, 9], [-0.6, -11], [2.0, 4], [-1.8, 13], [0.7, -5],
      [-2.2, 7], [1.5, -13], [-0.8, 2], [1.9, 11], [-1.2, -8]
    ];
    function layoutFan() {
      const root = document.getElementById('accordion');
      const shown = [...root.querySelectorAll('.folder:not([hidden])')];
      if (MOBILE.matches) {
        root.removeAttribute('style');
        shown.forEach(el => { el.style.left = el.style.top = ''; });
        return;
      }
      const cw = root.clientWidth;
      // Hidden (a project page is open): nothing to measure. route()
      // lays the stack out again on the way back.
      if (!cw) return;
      const gaps = Math.max(1, shown.length - 1);
      // Shrink the folders if the row would leave too thin a strip of each.
      const sc = Math.min(FAN.scale, (cw - gaps * FAN.minStep) / FAN.w);
      const step = shown.length > 1 ? (cw - FAN.w * sc) / gaps : 0;
      const lift = 44;                                  // room for hover nudge + jitter
      root.style.setProperty('--s', sc.toFixed(3));
      root.style.height = Math.round(lift + (FAN.h + FAN.jitterY) * sc + 24) + 'px';
      shown.forEach((el, n) => {
        // Neat stack: only the top folder keeps its tilt and offset.
        const [r, dy] = n === 0 ? MESS[+el.id.slice(1) % MESS.length] : [0, 0];
        el.style.setProperty('--r', r + 'deg');
        el.style.setProperty('--dy', dy + 'px');
        el.style.left = (n * step) + 'px';
        el.style.top = lift + 'px';
        el.style.zIndex = String(shown.length - n);
        el.classList.toggle('is-top', n === 0);
      });
    }

    function playVideo(e, url) {

    let canvaTimer = null;

    let canvaDecks = [];

    const PDF_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    function renderPdf(url) {
      const wrap = document.getElementById('canva-frame-wrap');
      const scroll = document.getElementById('pdf-scroll');
      wrap.style.display = 'none';
      scroll.style.display = 'block';
      scroll.innerHTML = '';
      scroll.scrollTop = 0;
      if (!window.pdfjsLib) {
        scroll.innerHTML = '<p class="pdf-msg">PDF viewer failed to load.</p>';
        return;
      }
      pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER;
      pdfjsLib.getDocument(url).promise.then(pdf => {
        for (let n = 1; n <= pdf.numPages; n++) {
          const canvas = document.createElement('canvas');
          canvas.className = 'pdf-page';
          scroll.appendChild(canvas);
          pdf.getPage(n).then(page => {
            const vp = page.getViewport({ scale: 2 });
            canvas.width = vp.width;
            canvas.height = vp.height;
            page.render({ canvasContext: canvas.getContext('2d'), viewport: vp });
          });
        }
      }).catch(() => {
        scroll.innerHTML = '<p class="pdf-msg">Could not load PDF.</p>';
      });
    }

    function showCanvaDeck(n) {
      canvaIdx = (n + canvaDecks.length) % canvaDecks.length;
      const url = canvaDecks[canvaIdx];
      if (/\.pdf($|\?|#)/i.test(url)) {
        renderPdf(url);
      } else {
        document.getElementById('pdf-scroll').style.display = 'none';
        const wrap = document.getElementById('canva-frame-wrap');

    function cycleCanva(n, restart) {

    function startCanvaAuto() {
      clearInterval(canvaTimer);
      if (canvaDecks.length > 1) {

    // ── APPLY FILTER ─────────────────────────────────────────────

    function centerTab(btn) {

      const off = btn.getBoundingClientRect().left - bar.getBoundingClientRect().left;

    // ── PHOTO FOCUS MODE ─────────────────────────────────────────
    // Click the photo to flip it to the note, float it to the centre of the
    // screen, and dim the rest of the site. Click again / backdrop / Esc closes.
    (function () {
      const clip = document.getElementById('photo-clip');
      const btn = document.getElementById('photo-flip');
      const backdrop = document.getElementById('focus-backdrop');
      if (!clip || !btn || !backdrop) return;

      let open = false;

      // Transform that flies the resting card to the viewport centre and scales
      // it up. Measured against the *untransformed* layout box so the maths is
      // independent of the card's resting tilt; keeps transform-origin at the
      // CSS default (top center) so the open/close tween stays smooth.
      function centerTransform() {
        const prev = clip.style.transform;
        const prevTrans = clip.style.transition;
        clip.style.transition = 'none';
        clip.style.transform = 'none';
        const r = clip.getBoundingClientRect();
        clip.style.transform = prev;
        clip.style.transition = prevTrans;
        const scale = Math.min(
          2.0,
          (window.innerHeight * 0.82) / r.height,
          (window.innerWidth * 0.92) / r.width
        );
        const dx = window.innerWidth / 2 - (r.left + r.width / 2);
        const dy = window.innerHeight / 2 - r.top - scale * r.height / 2;
        return `translate(${dx}px, ${dy}px) scale(${scale})`;
      }

      function openFocus() {
        if (open) return;
        open = true;
        clip.classList.add('hint-dismissed');   // retire the cue after first use
        clip.classList.remove('swaying');
        const target = centerTransform();
        requestAnimationFrame(() => {
          clip.style.transition = 'transform .5s cubic-bezier(.4,0,.2,1)';
          clip.classList.add('focus-active');   // flips the card
          clip.style.transform = target;
          backdrop.classList.add('show');
          btn.setAttribute('aria-pressed', 'true');
        });
      }

      function closeFocus() {
        if (!open) return;
        open = false;
        clip.classList.remove('focus-active');   // flips back
        clip.style.transform = '';               // eases home to the resting tilt
        backdrop.classList.remove('show');
        btn.setAttribute('aria-pressed', 'false');
        setTimeout(() => { if (!open) clip.style.transition = ''; }, 520);
      }

      btn.addEventListener('click', (e) => {
        e.preventDefault();
        open ? closeFocus() : openFocus();
      });
      backdrop.addEventListener('click', closeFocus);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeFocus();
      });
      window.addEventListener('resize', () => {
        if (open) clip.style.transform = centerTransform();
      });
    })();

  </script>
