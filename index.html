<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aleksandra Pavlova-Verevkina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #f2ece0;
      --grid: rgba(0, 0, 0, 0.055);
      --grid-sz: 22px;
      --ink: #1a1814;
      --ink-2: #5c5850;
      --ink-3: #9e9890;
      --border: #d0cac0;
      --surface: #faf7f0;
      --mustard: #c4953a;
      --soft-bg: #f1e3cf;
      --soft-bd: #d7c2a5;
      --soft-ink: #8a6a43;
      --hard-bg: #e4ebf0;
      --hard-bd: #b7c6d4;
      --hard-ink: #475b6e;
    }

    html {
      font-size: 110%;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background-color: var(--bg);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: var(--grid-sz) var(--grid-sz);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      padding: 2.25rem 3rem 1.5rem;
    }

    .header-cols {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 2.5rem;
      align-items: start;
    }

    .header-center {
      display: flex;
      justify-content: center;
      padding-top: 1.5rem;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1rem;
      padding-top: 0.5rem;
    }

    .eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-size: 2.75rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 0.95;
    }

    .header-role {
      font-family: 'Space Mono', monospace;
      font-size: 0.79rem;
      letter-spacing: 0.06em;
      color: var(--ink);
      margin-top: 0.6rem;
      display: inline-block;
      background: linear-gradient(
        103deg,
        transparent 1.8%,
        rgba(255, 228, 25, 0.497) 2.4%,
        rgba(255, 224, 15, 0.72) 38%,
        rgba(255, 231, 28, 0.83) 63%,
        rgba(255, 223, 18, 0.354) 96.5%,
        transparent 97.5%
      );
      padding: 0.08em 0.22em 0.06em;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }

    nav {
      display: flex;
      gap: 1.5rem;
      padding-bottom: 0.15rem;
    }

    nav a {
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mustard);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 1px;
      transition: color .18s, border-color .18s;
    }

    nav a:hover {
      color: var(--mustard);
      border-color: var(--mustard);
    }

    /* ── FILTER BAR ── */
    .filter-bar {
      padding: 0 3rem;
      display: flex;
      border-bottom: 1px solid var(--border);
    }

    .filter-btn {
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 0.65rem 1.4rem 0.55rem;
      cursor: pointer;
      margin-bottom: -1px;
      transition: color .18s;
    }

    .filter-btn:hover {
      color: var(--mustard);
    }

    .filter-btn.active {
      color: var(--mustard);
      border-bottom-color: var(--mustard);
    }

    /* ── PHOTO CLIP ── */
    .photo-clip {
      position: relative;
      width: 224px;
      transform: rotate(-2.5deg) translateX(8px);
      transform-origin: top center;
      filter: drop-shadow(3px 6px 14px rgba(0, 0, 0, 0.14));
      perspective: 900px;
    }

    .photo-flip {
      all: unset;
      display: block;
      width: 100%;
      cursor: pointer;
    }

    .photo-flip:focus-visible {
      outline: 2px solid var(--mustard);
      outline-offset: 4px;
    }

    .photo-card {
      position: relative;
      width: 100%;
      display: block;
      transform-style: preserve-3d;
      transition: transform .55s cubic-bezier(.4, 0, .2, 1);
    }

    .photo-clip:hover .photo-card,
    .photo-flip:hover .photo-card,
    .photo-flip:focus-visible .photo-card {
      transform: rotateY(180deg);
    }

    .photo-face {
      width: 100%;
      height: 100%;
      display: block;
      backface-visibility: hidden;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: #fff;
    }

    .photo-front {
      position: relative;
      z-index: 1;
    }

    .photo-back {
      position: absolute;
      inset: 0;
      transform: rotateY(180deg);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.7rem;
      overflow: hidden;
    }

    .note {
      width: 100%;
      height: 100%;
      border: none;
      padding: 0.6rem;
      background: repeating-linear-gradient(0deg,
          rgba(0, 0, 0, 0.04) 0,
          rgba(0, 0, 0, 0.04) 1px,
          transparent 1px,
          transparent 14px);
      font-family: 'Caveat', 'Space Mono', monospace;
      color: var(--ink-2);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      overflow: hidden;
    }

    .note-title {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .note-text {
      font-size: 0.82rem;
      line-height: 1.2;
    }

    .note-sign {
      margin-top: auto;
      font-size: 0.85rem;
      text-align: right;
    }

    .photo-clip img {
      width: 100%;
      height: auto;
      display: block;
    }

    .paperclip {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      pointer-events: none;
    }

    @keyframes sway {
      0% {
        transform: rotate(-2.5deg) translateX(8px);
      }

      18% {
        transform: rotate(4.5deg) translateX(8px);
      }

      36% {
        transform: rotate(-5.5deg) translateX(8px);
      }

      54% {
        transform: rotate(3deg) translateX(8px);
      }

      72% {
        transform: rotate(-3.5deg) translateX(8px);
      }

      88% {
        transform: rotate(-2deg) translateX(8px);
      }

      100% {
        transform: rotate(-2.5deg) translateX(8px);
      }
    }

    .photo-clip.swaying {
      animation: sway 0.9s cubic-bezier(.4, 0, .2, 1);
    }

    /* ── HERO ── */
    .hero {
      padding: 2rem 3rem 1.5rem;
      max-width: 900px;
    }

    .bio {
      font-size: 0.88rem;
      line-height: 1.65;
      color: var(--ink-2);
      max-width: 580px;
    }

    .bio-meta {
      margin-top: 0.7rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.08em;
      color: var(--ink-3);
    }

    /* ── SECTION LABEL ── */
    .sec-label {
      padding: 0.4rem 3rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    /* ── ACCORDION ── */
    .accordion-wrap {
      padding: 0 3rem 3rem;
    }

    .accordion {
      display: flex;
      gap: 2px;
      height: calc(100vh - 370px);
      min-height: 460px;
      max-height: 660px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .panel {
      position: relative;
      flex: 0 0 52px;
      overflow: hidden;
      cursor: pointer;
      transition: flex .52s cubic-bezier(.4, 0, .2, 1);
      border-right: 1px solid rgba(0, 0, 0, .07);
    }

    .panel:last-child {
      border-right: none;
    }

    .panel.open {
      flex: 1;
      cursor: default;
    }

    /* color fill (solid when collapsed, hidden behind content when open) */
    .panel-fill {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    /* ── SPINE (collapsed) ── */
    .panel-spine {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 0;
      opacity: 1;
      transition: opacity .15s;
      pointer-events: none;
    }

    .panel.open .panel-spine {
      opacity: 0;
    }

    .spine-code {
      font-family: 'Space Mono', monospace;
      font-size: 0.48rem;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, .5);
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    .spine-title {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, .92);
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      white-space: nowrap;
    }

    .spine-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .3);
    }

    /* ── CONTENT (expanded) ── */
    .panel-content {
      position: absolute;
      inset: 0;
      z-index: 2;
      padding: 1.75rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease .28s;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--surface);
      background-image:
        linear-gradient(rgba(0, 0, 0, .038) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, .038) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .panel.open .panel-content {
      opacity: 1;
      pointer-events: all;
    }

    .panel-content::-webkit-scrollbar {
      width: 3px;
    }

    .panel-content::-webkit-scrollbar-track {
      background: transparent;
    }

    .panel-content::-webkit-scrollbar-thumb {
      background: var(--border);
    }

    .c-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1.2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .c-code {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 0.3rem;
    }

    .c-title {
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .c-role {
      font-family: 'Space Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.06em;
      color: var(--ink-2);
      margin-top: 0.4rem;
    }

    .c-right {
      text-align: right;
      flex-shrink: 0;
    }

    .c-date {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.06em;
      color: var(--ink-3);
      white-space: nowrap;
    }

    .c-status {
      font-family: 'Space Mono', monospace;
      font-size: 0.5rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-top: 0.25rem;
      opacity: 0.65;
    }

    .c-img {
      width: 100%;
      height: 128px;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .c-img-lbl {
      font-family: 'Space Mono', monospace;
      font-size: 0.52rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .c-org {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 0.85rem;
    }

    .c-bullets {
      list-style: none;
      margin-bottom: 1.2rem;
    }

    .c-bullets li {
      display: flex;
      gap: 0.55rem;
      font-size: 0.77rem;
      line-height: 1.62;
      color: var(--ink-2);
      padding: 0.42rem 0;
      border-bottom: 1px solid var(--border);
    }

    .c-bullets li::before {
      content: '—';
      color: var(--ink-3);
      flex-shrink: 0;
      font-family: 'Space Mono', monospace;
      font-size: 0.68rem;
      margin-top: 0.07em;
    }

    .c-skills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .skill-tag {
      font-family: 'Space Mono', monospace;
      font-size: 1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-3);
      /* background: var(--soft-bg); */
      border: 1px solid var(--border);
      padding: 0.28rem 0.7rem;
      transition: color .15s, border-color .15s;
    }

    .skill-tag.soft {
      border-color: var(--soft-bd);
    }

    .skill-tag.hard {
      border-color: var(--hard-bd);
    }

    .skill-tag:hover {
      color: var(--ink);
      border-color: var(--ink-3);
    }

    /* ── FOOTER ── */
    footer {
      padding: 1.5rem 3rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 2rem;
    }

    .footer-name {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    .footer-links {
      display: flex;
      gap: 1.5rem;
    }

    .footer-links a {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.08em;
      color: var(--mustard);
      text-decoration: none;
      transition: color .15s;
    }

    .footer-links a:hover {
      color: var(--ink);
    }

    /* ── MILESTONES FULL VIEW ── */
    .hero-milestones-full:not([hidden]) {
      display: grid;
      grid-template-columns: calc((100vw - 11rem - 224px) / 2) 705px;
      gap: 2.5rem;
      position: relative;
      align-items: start;
    }

    .ms-carousel-outer {
      width: 705px;
      overflow: hidden;
      cursor: grab;
    }

    .ms-carousel-outer:active {
      cursor: grabbing;
    }

    .ms-track {
      display: flex;
      gap: 96px;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }

    .ms-item {
      flex: 0 0 130px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.65rem;
      opacity: 0.3;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }

    .ms-item.ms-active {
      opacity: 1;
      cursor: default;
    }

    .ms-stamp {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
    }

    .ms-stamp-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .ms-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.52rem;
      letter-spacing: 0.04em;
      line-height: 1.5;
      color: var(--ink-2);
      text-align: center;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .ms-info {
      min-width: 0;
    }

    .hero--milestones {
      max-width: none;
    }

    .ms-info-date {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.08em;
      color: var(--ink-3);
      margin-bottom: 0.5rem;
      transition: opacity 0.2s;
    }

    .ms-info-title {
      font-size: 0.88rem;
      font-weight: 400;
      line-height: 1.65;
      color: var(--ink-2);
      transition: opacity 0.2s;
    }

    .ms-info-title.ms-fade,
    .ms-info-date.ms-fade {
      opacity: 0;
    }

    /* lavender highlighter — same marker treatment as .header-role */
    .hl {
      color: var(--ink);
      background: linear-gradient(
        103deg,
        transparent 1.8%,
        rgba(187, 160, 240, 0.244) 2.4%,
        rgba(175, 146, 234, 0.295) 38%,
        rgba(185, 157, 240, 0.355) 63%,
        rgba(179, 150, 236, 0.258) 96.5%,
        transparent 97.5%
      );
      padding: 0.06em 0.2em 0.04em;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }

    .ms-nav {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 9px;
    }

    .ms-nav-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-radius: 50%;
      background: var(--border);
      border: none;
      cursor: pointer;
      padding: 0;
      transition: background 0.25s, transform 0.2s;
    }

    .ms-nav-dot.ms-nav-dot--active {
      background: #7B2340;
      transform: scale(1.25);
    }

    /* ── MILESTONES MOBILE STACK ── (hidden on desktop) */
    .ms-mobile-list {
      display: none;
    }

    /* ── MILESTONES FILTER BTN ── */
    .filter-btn--milestones {
      color: #7B2340;
      opacity: 0.55;
    }

    .filter-btn--milestones:hover {
      color: #7B2340;
      opacity: 1;
    }

    .filter-btn--milestones.active {
      color: #7B2340;
      opacity: 1;
      border-bottom-color: #7B2340;
    }

    /* ── MOBILE ── */
    @media (max-width: 767px) {
      /* Drop the 110% zoom and clip any stray horizontal overflow so the page
         opens at true device width with no empty gutter on the right. */
      html {
        font-size: 100%;
      }

      html,
      body {
        overflow-x: hidden;
      }

      header {
        padding: 1.5rem 1.5rem 1rem;
      }

      .header-cols {
        grid-template-columns: 1fr;
        gap: 1.25rem;
      }

      .header-center {
        justify-content: flex-start;
        padding-top: 0;
      }

      h1 {
        font-size: 2rem;
      }

      .filter-bar,
      .sec-label,
      .accordion-wrap {
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }

      /* Filters don't fit on one row — let them scroll sideways instead of
         spilling off-screen, so every tab (incl. Achievements) is reachable. */
      .filter-bar {
        overflow-x: auto;
        flex-wrap: nowrap;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .filter-bar::-webkit-scrollbar {
        display: none;
      }

      .filter-btn {
        flex: 0 0 auto;
        white-space: nowrap;
      }

      .hero {
        padding: 1.5rem;
      }

      /* Achievements becomes a plain vertical stack of folder cards. */
      .hero-milestones-full:not([hidden]) {
        display: block;
        grid-template-columns: none;
        position: static;
      }

      /* Carousel, nav dots and the single-item info panel are desktop-only. */
      .ms-carousel-outer,
      .ms-nav,
      .ms-info {
        display: none;
      }

      .ms-mobile-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .ms-card {
        border: 1px solid var(--border);
        border-top: 3px solid #7B2340;
        background: var(--surface);
        background-image:
          linear-gradient(rgba(0, 0, 0, .038) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 0, 0, .038) 1px, transparent 1px);
        background-size: 20px 20px;
        padding: 1.25rem 1.25rem 1.4rem;
      }

      .ms-card-head {
        margin-bottom: 1rem;
        padding-bottom: 0.9rem;
        border-bottom: 1px solid var(--border);
      }

      .ms-card-title {
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.25;
      }

      .ms-card-date {
        font-family: 'Space Mono', monospace;
        font-size: 0.56rem;
        letter-spacing: 0.08em;
        color: var(--ink-3);
        margin-top: 0.4rem;
      }

      .ms-card-seal {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        overflow: hidden;
        margin: 0 0 1rem;
      }

      .ms-card-seal img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .ms-card-body {
        font-size: 0.82rem;
        line-height: 1.6;
        color: var(--ink-2);
      }

      .photo-clip {
        width: 150px;
        transform: rotate(-2deg);
      }

      .note-title {
        font-size: 0.82rem;
      }

      .note-text {
        font-size: 0.72rem;
        line-height: 1.18;
      }

      .note-sign {
        font-size: 0.74rem;
      }

      .accordion {

    function msTargetOpacity(item, oRect) {
      const r = item.getBoundingClientRect();
      if (!r.width) return item.classList.contains('ms-active') ? 1 : 0;
      const visible = Math.min(r.right, oRect.right) - Math.max(r.left, oRect.left);
      const f = Math.max(0, Math.min(1, visible / r.width));
      return item.classList.contains('ms-active') ? 1 : 0.3 * f;
    }

    // Snap every stamp straight to its target (no easing) — used on first

    function msSnapOpacity() {

      if (!outer || !track) return;
      const oRect = outer.getBoundingClientRect();
      track.querySelectorAll('.ms-item').forEach(item => {
        const t = msTargetOpacity(item, oRect);
        item._op = t;
        item.style.opacity = t.toFixed(3);
      });
    }

    let msRafId = 0;
    let msAnimUntil = 0;

    function msTick() {
      const outer = document.getElementById('ms-carousel-outer');
      const track = document.getElementById('ms-track');
      if (!outer || !track) { msRafId = 0; return; }
      const oRect = outer.getBoundingClientRect();
      let moving = false;
      track.querySelectorAll('.ms-item').forEach(item => {
        const t = msTargetOpacity(item, oRect);
        const cur = item._op === undefined ? t : item._op;
        const next = cur + (t - cur) * 0.22;
        if (Math.abs(t - cur) > 0.003) moving = true;
        item._op = next;
        item.style.opacity = next.toFixed(3);
      });
      msRafId = (moving || performance.now() < msAnimUntil)
        ? requestAnimationFrame(msTick) : 0;
    }

    function msRunOpacity() {
      msAnimUntil = performance.now() + 680; // cover the full slide
      if (!msRafId) msRafId = requestAnimationFrame(msTick);
    }

    const HEADER_SKILLS = {
      loc: ['Russian (Native)', 'English C1', 'Localization', 'Interactive Storytelling', 'Style & Tone', 'Game Production', 'Sound Design', 'FMOD', 'Unity', 'Jira'],
      all: ['Scrum', 'Agile', 'Jira', 'Team Leadership', 'Sprint Planning', 'Game Design', 'Unity', 'Sound Design', 'Risk Management', 'FMOD'],
      games: ['Scrum', 'Agile', 'Jira', 'Team Leadership', 'Sprint Planning', 'Game Design', 'Unity', 'Sound Design', 'Risk Management', 'FMOD'],
      tech: ['Scrum', 'Kanban', 'LEAN', 'Jira', 'Sprint Planning', 'Risk Management', 'Stakeholder Comm.', 'KPI Tracking', 'Financial Analysis', 'Data Analysis']
    };

    const SOFT_SKILLS = new Set([
      'Team Leadership',
      'Stakeholder Communication',
      'Stakeholder Comm.'
    ]);

    // ── HELPERS ──────────────────────────────────────────────────

    function getParam() {
      const v = new URLSearchParams(location.search).get('view');
      return ['games', 'tech', 'achievements', 'loc'].includes(v) ? v : 'games';
    }

    function pushParam(f) {
      const u = new URL(location.href);
      u.searchParams.set('view', f);
      history.pushState({}, '', u);
    }

    function resolveKey(f) {
      if (f === 'tech') return 'tech';
      if (f === 'loc') return 'loc';
      return 'games';
    }

    function renderSkillTag(skill) {
      const type = SOFT_SKILLS.has(skill) ? 'soft' : 'hard';
      return `<span class="skill-tag ${type}">${skill}</span>`;
    }

    // ── BUILD ACCORDION ──────────────────────────────────────────

    function buildAccordion() {
      const root = document.getElementById('accordion');
      PROJECTS.forEach((p, i) => {
        const panel = document.createElement('div');
        panel.className = 'panel' + (i === 0 ? ' open' : '');
        panel.id = 'p' + i;

        panel.innerHTML = `
      <div class="panel-fill" style="background:${p.color}"></div>

      <div class="panel-spine">
        <div class="spine-code">${p.code}</div>
        <div class="spine-title">${p.title.toUpperCase()}</div>
        <div class="spine-dot"></div>
      </div>

      <div class="panel-content" style="border-top: 3px solid ${p.color}">
        <div class="c-header">
          <div>
            <div class="c-code">${p.code} // ${p.subtitle}</div>
            <div class="c-title">${p.title}</div>
            <div class="c-role js-role"></div>
          </div>
          <div class="c-right">
            <div class="c-date">${p.date}</div>
            <div class="c-status">${p.status}</div>
          </div>
        </div>

        <div class="c-img" style="background:${p.color}18; border: 1px solid ${p.color}35">
          <span class="c-img-lbl" style="color:${p.color}aa">Image Placeholder</span>
        </div>

        <div class="c-org">${p.org}</div>
        <ul class="c-bullets js-bullets"></ul>
        <div class="c-skills">
          ${p.skills.map(s => renderSkillTag(s)).join('')}
        </div>
      </div>
    `;

        panel.addEventListener('click', () => {
          if (!panel.classList.contains('open')) openPanel(i);
        });

        root.appendChild(panel);
      });
    }

    function openPanel(idx) {
      document.querySelectorAll('.panel').forEach((p, i) =>
        p.classList.toggle('open', i === idx)
      );
      const clip = document.getElementById('photo-clip');
      if (clip) {
        clip.classList.remove('swaying');
        void clip.offsetWidth;
        clip.classList.add('swaying');
      }
    }

    // ── APPLY FILTER ─────────────────────────────────────────────

    function applyFilter(f, push = true) {
      document.querySelectorAll('.filter-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.filter === f)
      );

      const heroContent = document.getElementById('hero-content');
      const heroMilestones = document.getElementById('hero-milestones-full');

      const heroEl = document.querySelector('.hero');
      const secLabel = document.getElementById('sec-label');
      const archiveWrap = document.querySelector('.accordion-wrap');
      if (f === 'achievements') {
        if (heroContent) heroContent.hidden = true;
        if (heroMilestones) heroMilestones.hidden = false;
        heroEl?.classList.add('hero--milestones');
        msSnapOpacity();
        // Achievements view stands on its own — hide the project archive below.
        if (secLabel) secLabel.hidden = true;
        if (archiveWrap) archiveWrap.hidden = true;
      } else {
        if (heroContent) heroContent.hidden = false;
        if (heroMilestones) heroMilestones.hidden = true;
        heroEl?.classList.remove('hero--milestones');
        if (secLabel) secLabel.hidden = false;
        if (archiveWrap) archiveWrap.hidden = false;

        document.getElementById('hero-bio').textContent = HERO[f] || HERO.all;

        const headerSkills = document.querySelector('.js-header-skills');
        if (headerSkills) {
          headerSkills.innerHTML = (HEADER_SKILLS[f] || HEADER_SKILLS.all)
            .map(s => renderSkillTag(s)).join('');
        }

        const key = resolveKey(f);
        let visibleCount = 0;
        let firstVisible = -1;
        PROJECTS.forEach((p, i) => {
          const panel = document.getElementById('p' + i);
          if (!panel) return;
          const hide = Array.isArray(p.hideIn) && p.hideIn.includes(f);
          panel.hidden = hide;
          if (hide) return;
          if (firstVisible === -1) firstVisible = i;
          visibleCount++;
          panel.querySelector('.js-role').textContent = p.roles[key];
          panel.querySelector('.js-bullets').innerHTML =
            p.bullets[key].map(b => `<li>${b}</li>`).join('');
        });

        if (secLabel) secLabel.textContent = `Archive Log // ${visibleCount} Projects`;

        // If the currently open panel was hidden in this view, open the first visible one.
        const openEl = document.querySelector('.panel.open');
        if ((!openEl || openEl.hidden) && firstVisible !== -1) openPanel(firstVisible);
      }

      if (push) pushParam(f);
    }

    // ── INIT ─────────────────────────────────────────────────────

    buildAccordion();
    buildMilestonesView();
    applyFilter(getParam(), false);

    document.querySelectorAll('.filter-btn').forEach(b =>
      b.addEventListener('click', () => applyFilter(b.dataset.filter))
    );

    window.addEventListener('popstate', () => applyFilter(getParam(), false));

  </script>
