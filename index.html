<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aleksandra Pavlova-Verevkina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #f2ece0;
      --grid: rgba(0, 0, 0, 0.055);
      --grid-sz: 22px;
      --ink: #1a1814;
      --ink-2: #5c5850;
      --ink-3: #9e9890;
      --border: #d0cac0;
      --surface: #faf7f0;
      --mustard: #c4953a;
      --soft-bg: #f1e3cf;
      --soft-bd: #d7c2a5;
      --soft-ink: #8a6a43;
      --hard-bg: #e4ebf0;
      --hard-bd: #b7c6d4;
      --hard-ink: #475b6e;
    }

    html {
      font-size: 110%;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background-color: var(--bg);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: var(--grid-sz) var(--grid-sz);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      padding: 2.25rem 3rem 1.5rem;
    }

    .header-cols {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 2.5rem;
      align-items: start;
    }

    .header-center {
      display: flex;
      justify-content: center;
      padding-top: 1.5rem;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1rem;
      padding-top: 0.5rem;
    }

    .eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-size: 2.75rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 0.95;
    }

    .header-role {
      font-family: 'Space Mono', monospace;
      font-size: 0.79rem;
      letter-spacing: 0.06em;
      color: var(--ink);
      margin-top: 0.6rem;
      display: inline-block;
      background: linear-gradient(
        103deg,
        transparent 1.8%,
        rgba(255, 228, 25, 0.497) 2.4%,
        rgba(255, 224, 15, 0.72) 38%,
        rgba(255, 231, 28, 0.83) 63%,
        rgba(255, 223, 18, 0.354) 96.5%,
        transparent 97.5%
      );
      padding: 0.08em 0.22em 0.06em;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }

    nav {
      display: flex;
      gap: 1.5rem;
      padding-bottom: 0.15rem;
    }

    nav a {
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mustard);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 1px;
      transition: color .18s, border-color .18s;
    }

    nav a:hover {
      color: var(--mustard);
      border-color: var(--mustard);
    }

    /* ── FILTER BAR ── */
    .filter-bar {
      padding: 0 3rem;
      display: flex;
      border-bottom: 1px solid var(--border);
    }

    .filter-btn {
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 0.65rem 1.4rem 0.55rem;
      cursor: pointer;
      margin-bottom: -1px;
      transition: color .18s;
    }

    .filter-btn:hover {
      color: var(--mustard);
    }

    .filter-btn.active {
      color: var(--mustard);
      border-bottom-color: var(--mustard);
    }

    /* ── PHOTO CLIP ── */
    .photo-clip {
      position: relative;
      width: 224px;
      transform: rotate(-2.5deg) translateX(8px);
      transform-origin: top center;
      filter: drop-shadow(3px 6px 14px rgba(0, 0, 0, 0.14));
      perspective: 900px;
    }

    .photo-flip {
      all: unset;
      display: block;
      width: 100%;
      cursor: pointer;
    }

    .photo-flip:focus-visible {
      outline: 2px solid var(--mustard);
      outline-offset: 4px;
    }

    .photo-card {
      position: relative;
      width: 100%;
      display: block;
      transform-style: preserve-3d;
      transition: transform .55s cubic-bezier(.4, 0, .2, 1);
    }

    .photo-clip:hover .photo-card,
    .photo-flip:hover .photo-card,
    .photo-flip:focus-visible .photo-card {
      transform: rotateY(180deg);
    }

    .photo-face {
      width: 100%;
      height: 100%;
      display: block;
      backface-visibility: hidden;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: #fff;
    }

    .photo-front {
      position: relative;
      z-index: 1;
    }

    .photo-back {
      position: absolute;
      inset: 0;
      transform: rotateY(180deg);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.9rem;
    }

    .note {
      width: 100%;
      height: 100%;
      border: none;
      padding: 0.8rem;
      background: repeating-linear-gradient(0deg,
          rgba(0, 0, 0, 0.04) 0,
          rgba(0, 0, 0, 0.04) 1px,
          transparent 1px,
          transparent 14px);
      font-family: 'Caveat', 'Space Mono', monospace;
      color: var(--ink-2);
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .note-title {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .note-text {
      font-size: 0.95rem;
      line-height: 1.25;
    }

    .note-sign {
      margin-top: auto;
      font-size: 0.95rem;
      text-align: right;
    }

    .photo-clip img {
      width: 100%;
      height: auto;
      display: block;
    }

    .paperclip {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      pointer-events: none;
    }

    @keyframes sway {
      0% {
        transform: rotate(-2.5deg) translateX(8px);
      }

      18% {
        transform: rotate(4.5deg) translateX(8px);
      }

      36% {
        transform: rotate(-5.5deg) translateX(8px);
      }

      54% {
        transform: rotate(3deg) translateX(8px);
      }

      72% {
        transform: rotate(-3.5deg) translateX(8px);
      }

      88% {
        transform: rotate(-2deg) translateX(8px);
      }

      100% {
        transform: rotate(-2.5deg) translateX(8px);
      }
    }

    .photo-clip.swaying {
      animation: sway 0.9s cubic-bezier(.4, 0, .2, 1);
    }

    /* ── HERO ── */
    .hero {
      padding: 2rem 3rem 1.5rem;
      max-width: 900px;
    }

    .bio {
      font-size: 0.88rem;
      line-height: 1.65;
      color: var(--ink-2);
      max-width: 580px;
    }

    .bio-meta {
      margin-top: 0.7rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.08em;
      color: var(--ink-3);
    }

    /* ── SECTION LABEL ── */
    .sec-label {
      padding: 0.4rem 3rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    /* ── ACCORDION ── */
    .accordion-wrap {
      padding: 0 3rem 3rem;
    }

    .accordion {
      display: flex;
      gap: 2px;
      height: calc(100vh - 370px);
      min-height: 460px;
      max-height: 660px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .panel {
      position: relative;
      flex: 0 0 52px;
      overflow: hidden;
      cursor: pointer;
      transition: flex .52s cubic-bezier(.4, 0, .2, 1);
      border-right: 1px solid rgba(0, 0, 0, .07);
    }

    .panel:last-child {
      border-right: none;
    }

    .panel.open {
      flex: 1;
      cursor: default;
    }

    /* color fill (solid when collapsed, hidden behind content when open) */
    .panel-fill {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    /* ── SPINE (collapsed) ── */
    .panel-spine {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 0;
      opacity: 1;
      transition: opacity .15s;
      pointer-events: none;
    }

    .panel.open .panel-spine {
      opacity: 0;
    }

    .spine-code {
      font-family: 'Space Mono', monospace;
      font-size: 0.48rem;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, .5);
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    .spine-title {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, .92);
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      white-space: nowrap;
    }

    .spine-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .3);
    }

    /* ── CONTENT (expanded) ── */
    .panel-content {
      position: absolute;
      inset: 0;
      z-index: 2;
      padding: 1.75rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease .28s;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--surface);
      background-image:
        linear-gradient(rgba(0, 0, 0, .038) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, .038) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .panel.open .panel-content {
      opacity: 1;
      pointer-events: all;
    }

    .panel-content::-webkit-scrollbar {
      width: 3px;
    }

    .panel-content::-webkit-scrollbar-track {
      background: transparent;
    }

    .panel-content::-webkit-scrollbar-thumb {
      background: var(--border);
    }

    .c-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1.2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .c-code {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 0.3rem;
    }

    .c-title {
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .c-role {
      font-family: 'Space Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.06em;
      color: var(--ink-2);
      margin-top: 0.4rem;
    }

    .c-right {
      text-align: right;
      flex-shrink: 0;
    }

    .c-date {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.06em;
      color: var(--ink-3);
      white-space: nowrap;
    }

    .c-status {
      font-family: 'Space Mono', monospace;
      font-size: 0.5rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-top: 0.25rem;
      opacity: 0.65;
    }

    .c-img {
      width: 100%;
      height: 128px;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .c-img-lbl {
      font-family: 'Space Mono', monospace;
      font-size: 0.52rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .c-org {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 0.85rem;
    }

    .c-bullets {
      list-style: none;
      margin-bottom: 1.2rem;
    }

    .c-bullets li {
      display: flex;
      gap: 0.55rem;
      font-size: 0.77rem;
      line-height: 1.62;
      color: var(--ink-2);
      padding: 0.42rem 0;
      border-bottom: 1px solid var(--border);
    }

    .c-bullets li::before {
      content: '—';
      color: var(--ink-3);
      flex-shrink: 0;
      font-family: 'Space Mono', monospace;
      font-size: 0.68rem;
      margin-top: 0.07em;
    }

    .c-skills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .skill-tag {
      font-family: 'Space Mono', monospace;
      font-size: 1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-3);
      /* background: var(--soft-bg); */
      border: 1px solid var(--border);
      padding: 0.28rem 0.7rem;
      transition: color .15s, border-color .15s;
    }

    .skill-tag.soft {
      border-color: var(--soft-bd);
    }

    .skill-tag.hard {
      border-color: var(--hard-bd);
    }

    .skill-tag:hover {
      color: var(--ink);
      border-color: var(--ink-3);
    }

    /* ── FOOTER ── */
    footer {
      padding: 1.5rem 3rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 2rem;
    }

    .footer-name {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    .footer-links {
      display: flex;
      gap: 1.5rem;
    }

    .footer-links a {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.08em;
      color: var(--mustard);
      text-decoration: none;
      transition: color .15s;
    }

    .footer-links a:hover {
      color: var(--ink);
    }

    /* ── MILESTONES FULL VIEW ── */
    .hero-milestones-full:not([hidden]) {
      display: grid;
      grid-template-columns: calc((100vw - 11rem - 224px) / 2) 705px;
      gap: 2.5rem;
      position: relative;
      align-items: start;
    }

    .ms-carousel-outer {
      width: 705px;
      overflow: hidden;
      cursor: grab;
    }

    .ms-carousel-outer:active {
      cursor: grabbing;
    }

    .ms-track {
      display: flex;
      gap: 80px;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }

    .ms-item {
      flex: 0 0 130px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.65rem;
      opacity: 0.3;
      transition: opacity 0.4s ease;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }

    .ms-item.ms-active {
      opacity: 1;
      cursor: default;
    }

    .ms-stamp {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
    }

    .ms-stamp-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .ms-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.52rem;
      letter-spacing: 0.04em;
      line-height: 1.5;
      color: var(--ink-2);
      text-align: center;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .ms-info {
      min-width: 0;
    }

    .hero--milestones {
      max-width: none;
    }

    .ms-info-date {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.08em;
      color: var(--ink-3);
      margin-bottom: 0.5rem;
      transition: opacity 0.2s;
    }

    .ms-info-title {
      font-size: 0.88rem;
      font-weight: 400;
      line-height: 1.65;
      color: var(--ink-2);
      transition: opacity 0.2s;
    }

    .ms-info-title.ms-fade,
    .ms-info-date.ms-fade {
      opacity: 0;
    }

    .ms-nav {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .ms-nav-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--border);
      border: none;
      cursor: pointer;
      padding: 0;
      transition: background 0.25s, transform 0.2s;
    }

    .ms-nav-dot.ms-nav-dot--active {
      background: #7B2340;
      transform: scale(1.25);
    }

    /* ── MILESTONES FILTER BTN ── */
    .filter-btn--milestones {
      color: #7B2340;
      opacity: 0.55;
    }

    .filter-btn--milestones:hover {
      color: #7B2340;
      opacity: 1;
    }

    .filter-btn--milestones.active {
      color: #7B2340;
      opacity: 1;
      border-bottom-color: #7B2340;
    }

    /* ── MOBILE ── */
    @media (max-width: 767px) {
      header {
        padding: 1.5rem 1.5rem 1rem;
      }

      .header-cols {
        grid-template-columns: 1fr;
        gap: 1.25rem;
      }

      .header-center {
        justify-content: flex-start;
        padding-top: 0;
      }

      h1 {
        font-size: 2rem;
      }

      .filter-bar,
      .sec-label,
      .accordion-wrap {
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }

      .hero {
        padding: 1.5rem;
      }

      .hero-milestones-full:not([hidden]) {
        display: flex;
        flex-wrap: wrap;
        grid-template-columns: none;
        position: static;
        gap: 1.25rem;
      }

      .ms-nav {
        position: static;
      }

      .ms-carousel-outer {
        width: 100%;
        max-width: 470px;
      }

      .photo-clip {
        width: 120px;
        transform: rotate(-2deg);
      }

      .accordion {
        flex-direction: column;
        height: auto;
        max-height: none;
        min-height: auto;
        gap: 8px;
      }

      .panel {
        flex: none !important;
        height: auto;
        cursor: default;
        border-right: none;
      }

      .panel-spine {
        display: none;
      }

      .panel-fill {
        height: 3px;
        bottom: auto;
      }

      .panel-content {
        position: static;
        opacity: 1 !important;
        pointer-events: all !important;
        transition: none;
      }

      footer {
        padding: 1.5rem;
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-cols">
      <div class="header-left">
        <div class="eyebrow">Portfolio Archive // 2024–2026</div>
        <h1>Aleksandra<br>Pavlova-Verevkina</h1>
        <div class="header-role">Junior PM · Producer · Game Development</div>
      </div>
      <div class="header-center">
        <div class="photo-clip" id="photo-clip">
          <button class="photo-flip" id="photo-flip" type="button" aria-pressed="false"
            aria-label="Flip photo to read note">
            <span class="photo-card">
              <span class="paperclip">
                <svg width="22" height="54" viewBox="0 0 16 40" fill="none">
                  <path
                    d="M8.5 3 C5 3 2.5 5 2.5 8.5 L2.5 31 C2.5 35 5 37 8.5 37 C12 37 14.5 35 14.5 31 L14.5 10.5 C14.5 7.5 12.5 6 10 6 C7.5 6 6 7.5 6 10.5 L6 29 C6 31.5 7 32.5 8.5 32.5"
                    stroke="rgba(0,0,0,0.15)" stroke-width="2.2" stroke-linecap="round" />
                  <path
                    d="M8 2.5 C4.5 2.5 2 4.5 2 8 L2 30.5 C2 34.5 4.5 36.5 8 36.5 C11.5 36.5 14 34.5 14 30.5 L14 10 C14 7 12 5.5 9.5 5.5 C7 5.5 5.5 7 5.5 10 L5.5 28.5 C5.5 31 6.5 32 8 32"
                    stroke="#b8b2aa" stroke-width="1.8" stroke-linecap="round" />
                  <path d="M7.5 2.5 C4 2.5 1.5 4.5 1.5 8" stroke="rgba(255,255,255,0.55)" stroke-width="1.2"
                    stroke-linecap="round" />
                </svg>
              </span>
              <span class="photo-face photo-front">
                <img src="photo.jpg" alt="Aleksandra Pavlova-Verevkina">
              </span>
              <span class="photo-face photo-back">
                <span class="note">
                  <span class="note-title">Hello!</span>
                  <span class="note-text">Composed and organized, I keep plans clear but stay flexible when reality
                    shifts. I can explain my choices and tradeoffs, and I aim to be a calming, steady presence for the
                    team. Let's talk!</span>
                  <span class="note-sign">— Aleksandra</span>
                </span>
              </span>
            </span>
          </button>
        </div>
      </div>
      <div class="header-right">
        <div class="c-skills js-header-skills"></div>

  <script>
    // ── MILESTONES ───────────────────────────────────────────────

    const MS_PLACEHOLDER = 'Text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text text.';

    const MILESTONES = [
      { title: "Bachelor's in Game Design and Project Management", date: "June 2026",  body: MS_PLACEHOLDER },
      { title: "Untitled Driving Game Prototype",                   date: "May 2026",   body: MS_PLACEHOLDER },
      { title: 'Exhibited "Hauntel Management" at Gotland Game Conference', date: "June 2025", body: MS_PLACEHOLDER },
      { title: 'Published "Splish-Splash Submarine" on itch.io',   date: "March 2024", body: MS_PLACEHOLDER },
      { title: "Enrolled at Uppsala University",                    date: "September 2022", body: MS_PLACEHOLDER }
    ];

    const MS_STAMP_W = 130;
    const MS_GAP = 80;
    const MS_STEP = MS_STAMP_W + MS_GAP; // 210
    const MS_CONTAINER_W = 705;
    const MS_OFFSET = Math.round((MS_CONTAINER_W - MS_STAMP_W) / 2); // 288

    // Infinite loop: render several repeated copies of the milestones and keep
    // the active slot inside the middle copy, snapping back invisibly at the edges.
    const MS_N = MILESTONES.length;
    const MS_COPIES = 9;                 // odd, so there is a true middle copy
    const MS_TOTAL = MS_N * MS_COPIES;
    const MS_BASE = Math.floor(MS_COPIES / 2) * MS_N; // first index of middle copy
    const MS_INITIAL = 2;               // milestone centred on load

    // `pos` is the rendered-item index currently centred; data index = pos mod N.
    const MS_STATE = { pos: MS_BASE + MS_INITIAL };
    let msNavToken = 0;

    function msData(pos) { return ((pos % MS_N) + MS_N) % MS_N; }

    function msSetStyling(pos) {
      const track = document.getElementById('ms-track');
      const nav = document.getElementById('ms-nav');
      if (!track || !nav) return;
      track.querySelectorAll('.ms-item').forEach((item, i) =>
        item.classList.toggle('ms-active', i === pos)
      );
      const di = msData(pos);
      nav.querySelectorAll('.ms-nav-dot').forEach((dot, i) =>
        dot.classList.toggle('ms-nav-dot--active', i === di)
      );
    }

    function buildMilestonesView() {
      const track = document.getElementById('ms-track');
      const nav = document.getElementById('ms-nav');
      if (!track || !nav) return;

      // Repeated milestone copies for seamless looping
      for (let i = 0; i < MS_TOTAL; i++) {
        const m = MILESTONES[msData(i)];
        const item = document.createElement('div');
        item.className = 'ms-item' + (i === MS_STATE.pos ? ' ms-active' : '');
        item.innerHTML = `
          <div class="ms-stamp">
            <img src="Uppsala_University_logo.svg.png" alt="Uppsala University seal" class="ms-stamp-img" draggable="false"/>
          </div>
          <div class="ms-label">${m.title}</div>
        `;
        item.addEventListener('click', () => msGoTo(i));
        track.appendChild(item);
      }

      // One nav dot per real milestone
      MILESTONES.forEach((m, i) => {
        const dot = document.createElement('button');
        dot.className = 'ms-nav-dot' + (i === MS_INITIAL ? ' ms-nav-dot--active' : '');
        dot.setAttribute('aria-label', `Milestone ${i + 1}: ${m.title}`);
        dot.addEventListener('click', () => msGoToData(i));
        nav.appendChild(dot);
      });

      // Initial position: centre active item
      track.style.transition = 'none';
      track.style.transform = `translateX(${MS_OFFSET - MS_STATE.pos * MS_STEP}px)`;
      track.offsetHeight; // force reflow
      track.style.transition = '';

      const titleEl = document.getElementById('ms-info-title');
      const dateEl = document.getElementById('ms-info-date');
      if (titleEl) titleEl.textContent = MILESTONES[msData(MS_STATE.pos)].body;
      if (dateEl) dateEl.textContent = MILESTONES[msData(MS_STATE.pos)].date;

      // Wheel scroll
      const outer = document.getElementById('ms-carousel-outer');
      let wheelLock = false;
      outer.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (wheelLock) return;
        wheelLock = true;
        setTimeout(() => { wheelLock = false; }, 620);
        const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
        if (d > 0) msGoTo(MS_STATE.pos + 1);
        else if (d < 0) msGoTo(MS_STATE.pos - 1);
      }, { passive: false });

      // Pointer drag
      let dragStartX = null;
      outer.addEventListener('pointerdown', (e) => {
        dragStartX = e.clientX;
        outer.setPointerCapture(e.pointerId);
      });
      outer.addEventListener('pointerup', (e) => {
        if (dragStartX === null) return;
        const dx = e.clientX - dragStartX;
        dragStartX = null;
        if (dx < -40) msGoTo(MS_STATE.pos + 1);
        else if (dx > 40) msGoTo(MS_STATE.pos - 1);
      });

      // Arrow keys (only when milestones view visible)
      document.addEventListener('keydown', (e) => {
        const view = document.getElementById('hero-milestones-full');
        if (!view || view.hidden) return;
        if (e.key === 'ArrowRight') msGoTo(MS_STATE.pos + 1);
        if (e.key === 'ArrowLeft') msGoTo(MS_STATE.pos - 1);
      });
    }

    // Navigate to a milestone by its data index, taking the shortest looped path.
    function msGoToData(dataIdx) {
      let diff = dataIdx - msData(MS_STATE.pos);
      while (diff > MS_N / 2) diff -= MS_N;
      while (diff < -MS_N / 2) diff += MS_N;
      msGoTo(MS_STATE.pos + diff);
    }

    // After the slide settles, jump (without transition) back to the middle copy.
    // The rendered content repeats with period N, so the jump is visually invisible.
    function msRecenter() {
      const np = MS_BASE + msData(MS_STATE.pos);
      if (np === MS_STATE.pos) return;
      MS_STATE.pos = np;
      const track = document.getElementById('ms-track');
      if (!track) return;
      track.style.transition = 'none';
      track.style.transform = `translateX(${MS_OFFSET - np * MS_STEP}px)`;
      track.offsetHeight; // force reflow
      track.style.transition = '';
      msSetStyling(np);
    }

    function msGoTo(pos) {
      if (pos === MS_STATE.pos) return;

      MS_STATE.pos = pos;
      const token = ++msNavToken;

      const track = document.getElementById('ms-track');
      if (!track) return;

      track.style.transform = `translateX(${MS_OFFSET - pos * MS_STEP}px)`;

      const titleEl = document.getElementById('ms-info-title');
      const dateEl = document.getElementById('ms-info-date');
      if (titleEl) titleEl.classList.add('ms-fade');
      if (dateEl) dateEl.classList.add('ms-fade');

      // Brighten the incoming stamp and reveal its paragraph at the same moment
      setTimeout(() => {
        if (token !== msNavToken) return;
        msSetStyling(pos);
        if (titleEl) {
          titleEl.textContent = MILESTONES[msData(pos)].body;
          titleEl.classList.remove('ms-fade');
        }
        if (dateEl) {
          dateEl.textContent = MILESTONES[msData(pos)].date;
          dateEl.classList.remove('ms-fade');
        }
      }, 200);

      // Once the slide has finished, snap back to the middle copy
      setTimeout(() => {
        if (token === msNavToken) msRecenter();
      }, 560);
    }

    const HEADER_SKILLS = {
      all: ['Scrum', 'Agile', 'Jira', 'Team Leadership', 'Sprint Planning', 'Game Design', 'Unity', 'Sound Design', 'Risk Management', 'FMOD'],
      games: ['Scrum', 'Agile', 'Jira', 'Team Leadership', 'Sprint Planning', 'Game Design', 'Unity', 'Sound Design', 'Risk Management', 'FMOD'],
      tech: ['Scrum', 'Kanban', 'LEAN', 'Jira', 'Sprint Planning', 'Risk Management', 'Stakeholder Comm.', 'KPI Tracking', 'Financial Analysis', 'Data Analysis']
    };

    const SOFT_SKILLS = new Set([
      'Team Leadership',
      'Stakeholder Communication',
      'Stakeholder Comm.'
    ]);

    // ── HELPERS ──────────────────────────────────────────────────

    function getParam() {
      const v = new URLSearchParams(location.search).get('view');
      return ['games', 'tech', 'milestones'].includes(v) ? v : 'all';
    }

    function pushParam(f) {
      const u = new URL(location.href);
      if (f === 'all') u.searchParams.delete('view');
      else u.searchParams.set('view', f);
      history.pushState({}, '', u);
    }

    function resolveKey(f) {
      return f === 'tech' ? 'tech' : 'games';
    }

    function renderSkillTag(skill) {
      const type = SOFT_SKILLS.has(skill) ? 'soft' : 'hard';
      return `<span class="skill-tag ${type}">${skill}</span>`;
    }

    // ── BUILD ACCORDION ──────────────────────────────────────────

    function buildAccordion() {
      const root = document.getElementById('accordion');
      PROJECTS.forEach((p, i) => {
        const panel = document.createElement('div');
        panel.className = 'panel' + (i === 0 ? ' open' : '');
        panel.id = 'p' + i;

        panel.innerHTML = `
      <div class="panel-fill" style="background:${p.color}"></div>

      <div class="panel-spine">
        <div class="spine-code">${p.code}</div>
        <div class="spine-title">${p.title.toUpperCase()}</div>
        <div class="spine-dot"></div>
      </div>

      <div class="panel-content" style="border-top: 3px solid ${p.color}">
        <div class="c-header">
          <div>
            <div class="c-code">${p.code} // ${p.subtitle}</div>
            <div class="c-title">${p.title}</div>
            <div class="c-role js-role"></div>
          </div>
          <div class="c-right">
            <div class="c-date">${p.date}</div>
            <div class="c-status">${p.status}</div>
          </div>
        </div>

        <div class="c-img" style="background:${p.color}18; border: 1px solid ${p.color}35">
          <span class="c-img-lbl" style="color:${p.color}aa">Image Placeholder</span>

        <div class="c-org">${p.org}</div>
        <ul class="c-bullets js-bullets"></ul>
        <div class="c-skills">
          ${p.skills.map(s => renderSkillTag(s)).join('')}

      </div>
    `;

        panel.addEventListener('click', () => {
          if (!panel.classList.contains('open')) openPanel(i);
        });

        root.appendChild(panel);
      });
    }

    function openPanel(idx) {
      document.querySelectorAll('.panel').forEach((p, i) =>
        p.classList.toggle('open', i === idx)
      );
      const clip = document.getElementById('photo-clip');
      if (clip) {
        clip.classList.remove('swaying');
        void clip.offsetWidth;
        clip.classList.add('swaying');
      }
    }

    // ── APPLY FILTER ─────────────────────────────────────────────

    function applyFilter(f, push = true) {
      document.querySelectorAll('.filter-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.filter === f)
      );

      const heroContent = document.getElementById('hero-content');
      const heroMilestones = document.getElementById('hero-milestones-full');

      const heroEl = document.querySelector('.hero');
      if (f === 'milestones') {
        if (heroContent) heroContent.hidden = true;
        if (heroMilestones) heroMilestones.hidden = false;
        heroEl?.classList.add('hero--milestones');
      } else {
        if (heroContent) heroContent.hidden = false;
        if (heroMilestones) heroMilestones.hidden = true;
        heroEl?.classList.remove('hero--milestones');

        document.getElementById('hero-bio').textContent = HERO[f] || HERO.all;

        const headerSkills = document.querySelector('.js-header-skills');
        if (headerSkills) {
          headerSkills.innerHTML = (HEADER_SKILLS[f] || HEADER_SKILLS.all)
            .map(s => renderSkillTag(s)).join('');
        }

        const key = resolveKey(f);
        PROJECTS.forEach((p, i) => {
          const panel = document.getElementById('p' + i);
          if (!panel) return;
          panel.querySelector('.js-role').textContent = p.roles[key];
          panel.querySelector('.js-bullets').innerHTML =
            p.bullets[key].map(b => `<li>${b}</li>`).join('');
        });
      }

      if (push) pushParam(f);
    }

    // ── INIT ─────────────────────────────────────────────────────

    buildAccordion();
    buildMilestonesView();
    applyFilter(getParam(), false);

    document.querySelectorAll('.filter-btn').forEach(b =>
      b.addEventListener('click', () => applyFilter(b.dataset.filter))
    );

    window.addEventListener('popstate', () => applyFilter(getParam(), false));

  </script>
